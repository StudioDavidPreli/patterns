<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASALT v1 — specimen</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:      #e8e4dc;
    --paper-deep: #d8d3c8;
    --ink:        #131210;
    --ink-soft:   #4a4640;
    --ink-faint:  #8a857c;
    --rule:       #131210;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--paper); color: var(--ink);
    font-family: var(--mono);
    font-size: 12px; line-height: 1.5;
    height: 100vh; overflow: hidden;
  }

  .workspace { display: flex; height: 100vh; }
  .sidebar { width: 380px; min-width: 380px; overflow-y: auto; padding: 30px 22px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid rgba(19,18,16,0.18); }
  .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; }

  body::before {
    content: ""; position: fixed; inset: 0;
    pointer-events: none; z-index: 100;
    background-image:
      radial-gradient(rgba(19,18,16,0.04) 1px, transparent 1px),
      radial-gradient(rgba(19,18,16,0.025) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply; opacity: 0.6;
  }

  header { text-align: left; }
  header .kicker {
    font-size: 10px; letter-spacing: 0.22em;
    color: var(--ink-faint); margin-bottom: 6px;
  }
  header h1 {
    font-size: 16px; font-weight: 600;
    letter-spacing: 0.05em; margin: 0 0 8px 0;
  }
  header p { margin: 0; color: var(--ink-soft); font-size: 11px; }

  #sketch {
    border: 1px solid rgba(19,18,16,0.18);
    background: var(--paper);
    display: inline-block;
    line-height: 0; font-size: 0;
  }
  #sketch canvas { display: block; }

  .label {
    font-size: 11px; letter-spacing: 0.22em;
    font-weight: 500; color: var(--ink);
  }

  .controls-row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 8px 14px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 2px;
    cursor: pointer;
  }
  button:hover { background: var(--paper-deep); }
  button:active { transform: translateY(1px); }

  .panel {
    width: 100%;
    background: var(--paper-deep);
    border: 1px solid rgba(19,18,16,0.18);
    padding: 18px 22px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .panel-group h4 {
    font-size: 9px; letter-spacing: 0.24em;
    color: var(--ink-faint); margin: 0 0 10px 0;
    font-weight: 500;
  }

  .panel-group-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px; gap: 12px;
  }
  .panel-group-head h4 { margin: 0; }
  .tone-meta { display: flex; align-items: center; gap: 12px; }
  .tone-curve { flex-shrink: 0; background: rgba(19,18,16,0.04); }
  .luma-readout {
    font-size: 9px; letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .inline-btn {
    font-family: var(--mono); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 3px 7px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 1px;
    cursor: pointer; line-height: 1;
  }
  .inline-btn:hover { background: var(--paper-deep); }

  .panel-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 5px;
  }
  .panel-grid label {
    display: grid; grid-template-columns: 80px 1fr 44px;
    gap: 8px; align-items: center;
    font-size: 9.5px; letter-spacing: 0.1em;
  }
  .panel-grid .name { color: var(--ink-soft); }
  .panel-grid .val {
    color: var(--ink); text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 1px;
    background: var(--ink); outline: none;
    margin: 0; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    background: var(--ink); cursor: pointer;
    border: 0; border-radius: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px;
    background: var(--ink); cursor: pointer;
    border: none; border-radius: 0;
  }

  input[type="color"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px;
    border: 1px solid var(--ink);
    background: none; cursor: pointer; padding: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
  input[type="color"]::-webkit-color-swatch { border: none; }
  input[type="color"]::-moz-color-swatch { border: none; }

  .breed-selector {
    display: flex; gap: 16px; margin-bottom: 14px;
    font-size: 9.5px; letter-spacing: 0.1em;
    color: var(--ink-soft); flex-wrap: wrap;
  }
  .breed-radio { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .breed-radio input[type="radio"] {
    appearance: none; -webkit-appearance: none;
    width: 11px; height: 11px;
    border: 1px solid var(--ink); border-radius: 50%;
    outline: none; cursor: pointer; margin: 0;
    position: relative; background: var(--paper);
  }
  .breed-radio input[type="radio"]:checked::after {
    content: '';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 5px; height: 5px;
    background: var(--ink); border-radius: 50%;
  }
  .breed-radio input[type="radio"]:checked + span { color: var(--ink); }
  .breed-params { display: none; }
  .breed-params.active { display: grid; }

  #params-color_cluster.active {
    display: flex; flex-direction: column; gap: 10px;
  }
  .cc-radio-row {
    display: flex; gap: 12px; align-items: center;
    flex-wrap: wrap; font-size: 9.5px; letter-spacing: 0.1em;
  }
  .cc-radio-row .name { color: var(--ink-soft); min-width: 62px; }
  #cc-palette-preview { display: flex; gap: 4px; align-items: center; }
  #cc-palette-preview .swatch {
    width: 24px; height: 14px; border: 1px solid var(--ink);
  }

  #threeDebug {
    display: none;
    background: var(--paper-deep);
    border: 1px solid rgba(19,18,16,0.18);
    padding: 12px;
  }
  #threeDebug .dbg-row {
    text-align: center;
    margin-bottom: 8px;
  }
  #threeDebug .dbg-row:last-child { margin-bottom: 0; }
  #threeDebug .dbg-label {
    font-size: 9px; letter-spacing: 0.22em;
    color: var(--ink-faint); margin-top: 4px;
  }
  #threeDebug canvas {
    display: inline-block; max-width: 100%;
    background:
      linear-gradient(45deg, #c8c2b6 25%, transparent 25%),
      linear-gradient(-45deg, #c8c2b6 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c8c2b6 75%),
      linear-gradient(-45deg, transparent 75%, #c8c2b6 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  }

  .specimen {
    font-size: 10.5px; line-height: 1.7;
    color: var(--ink-soft); text-align: left;
    white-space: pre;
    background: var(--paper-deep);
    border: 1px solid rgba(19,18,16,0.12);
    padding: 16px 22px; border-radius: 2px;
    width: 100%; overflow-x: auto;
  }
</style>
</head>
<body>
<div class="workspace">
<div class="sidebar">

<header>
  <div class="kicker">BASALT &middot; v1</div>
  <h1>Specimen</h1>
</header>

<div class="controls-row">
  <button id="reseedForm">NEW FORM SEED</button>
  <button id="reseedBreed">NEW BREED SEED</button>
  <button id="toggle3d">SHOW 3D SOURCE</button>
  <button id="savePng">SAVE PNG</button>
  <button id="reset">RESET</button>
</div>

<div class="panel">
  <div class="panel-group">
    <h4>VIEW</h4>
    <div class="panel-grid">
      <label>
        <span class="name">CAM X</span>
        <input type="range" id="cam-x" min="-4" max="4" step="0.01" value="1.50">
        <span class="val" id="cam-x-val">1.50</span>
      </label>
      <label>
        <span class="name">CAM Y</span>
        <input type="range" id="cam-y" min="-3" max="5" step="0.01" value="1.80">
        <span class="val" id="cam-y-val">1.80</span>
      </label>
      <label>
        <span class="name">CAM Z</span>
        <input type="range" id="cam-z" min="-4" max="6" step="0.01" value="3.00">
        <span class="val" id="cam-z-val">3.00</span>
      </label>
      <label>
        <span class="name">FOV</span>
        <input type="range" id="cam-fov" min="15" max="60" step="0.5" value="32">
        <span class="val" id="cam-fov-val">32.0&deg;</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>SHAPE</h4>
    <div class="panel-grid">
      <label>
        <span class="name">ROT X</span>
        <input type="range" id="rot-x" min="-180" max="180" step="0.5" value="0">
        <span class="val" id="rot-x-val">0.0&deg;</span>
      </label>
      <label>
        <span class="name">ROT Y</span>
        <input type="range" id="rot-y" min="-180" max="180" step="0.5" value="0">
        <span class="val" id="rot-y-val">0.0&deg;</span>
      </label>
      <label>
        <span class="name">ROT Z</span>
        <input type="range" id="rot-z" min="-180" max="180" step="0.5" value="0">
        <span class="val" id="rot-z-val">0.0&deg;</span>
      </label>
      <label>
        <span class="name">COLS X</span>
        <input type="range" id="bs-colsX" min="1" max="8" step="1" value="4">
        <span class="val" id="bs-colsX-val">4</span>
      </label>
      <label>
        <span class="name">COLS Z</span>
        <input type="range" id="bs-colsZ" min="1" max="8" step="1" value="3">
        <span class="val" id="bs-colsZ-val">3</span>
      </label>
      <label>
        <span class="name">COL SIZE</span>
        <input type="range" id="bs-colSize" min="0.10" max="0.60" step="0.01" value="0.30">
        <span class="val" id="bs-colSize-val">0.30</span>
      </label>
      <label>
        <span class="name">HEIGHT</span>
        <input type="range" id="bs-height" min="0.30" max="2.50" step="0.01" value="1.20">
        <span class="val" id="bs-height-val">1.20</span>
      </label>
      <label>
        <span class="name">HEIGHT VAR</span>
        <input type="range" id="bs-heightVar" min="0.00" max="1.00" step="0.01" value="0.40">
        <span class="val" id="bs-heightVar-val">0.40</span>
      </label>
      <label>
        <span class="name">GAP</span>
        <input type="range" id="bs-gap" min="0.00" max="0.20" step="0.01" value="0.03">
        <span class="val" id="bs-gap-val">0.03</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>LIGHT</h4>
    <div class="panel-grid">
      <label>
        <span class="name">LIGHT X</span>
        <input type="range" id="light-x" min="-2" max="2" step="0.01" value="-0.60">
        <span class="val" id="light-x-val">-0.60</span>
      </label>
      <label>
        <span class="name">LIGHT Y</span>
        <input type="range" id="light-y" min="-1" max="2" step="0.01" value="1.00">
        <span class="val" id="light-y-val">1.00</span>
      </label>
      <label>
        <span class="name">LIGHT Z</span>
        <input type="range" id="light-z" min="-2" max="2" step="0.01" value="0.50">
        <span class="val" id="light-z-val">0.50</span>
      </label>
      <label>
        <span class="name">KEY</span>
        <input type="range" id="light-key" min="0" max="3" step="0.05" value="1.30">
        <span class="val" id="light-key-val">1.30</span>
      </label>
      <label>
        <span class="name">AMBIENT</span>
        <input type="range" id="light-ambient" min="0" max="1" step="0.01" value="0.10">
        <span class="val" id="light-ambient-val">0.10</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <div class="panel-group-head">
      <h4>TONE</h4>
      <div class="tone-meta">
        <svg class="tone-curve" id="tone-curve" width="48" height="24" viewBox="0 0 48 24" preserveAspectRatio="none">
          <rect x="0.5" y="0.5" width="47" height="23" fill="none" stroke="rgba(19,18,16,0.25)" stroke-width="0.5"/>
          <line x1="0" y1="24" x2="48" y2="0" stroke="rgba(19,18,16,0.15)" stroke-width="0.5" stroke-dasharray="1,1"/>
          <path id="tone-curve-path" fill="none" stroke="#131210" stroke-width="1.2" d=""/>
        </svg>
        <span class="luma-readout" id="luma-readout">LUMA --</span>
        <button class="inline-btn" id="auto-levels">AUTO</button>
      </div>
    </div>
    <div class="panel-grid">
      <label>
        <span class="name">BLACK PT</span>
        <input type="range" id="tone-black" min="0" max="0.5" step="0.005" value="0.0">
        <span class="val" id="tone-black-val">0.000</span>
      </label>
      <label>
        <span class="name">WHITE PT</span>
        <input type="range" id="tone-white" min="0.5" max="1.0" step="0.005" value="1.0">
        <span class="val" id="tone-white-val">1.000</span>
      </label>
      <label>
        <span class="name">GAMMA</span>
        <input type="range" id="tone-gamma" min="0.30" max="3.0" step="0.01" value="1.0">
        <span class="val" id="tone-gamma-val">1.00</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>POLARITY</h4>
    <div class="breed-selector" style="margin-bottom: 10px;">
      <label class="breed-radio">
        <input type="radio" name="polarity" value="positive" checked>
        <span>POSITIVE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="polarity" value="negative">
        <span>NEGATIVE</span>
      </label>
    </div>
    <div class="panel-grid">
      <label>
        <span class="name">FILL LUMA</span>
        <input type="range" id="fill-luma" min="0.00" max="1.00" step="0.01" value="0.00">
        <span class="val" id="fill-luma-val">0.00</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>INK</h4>
    <div class="panel-grid">
      <label>
        <span class="name">COLOR</span>
        <input type="color" id="ink-color" value="#0e0d0b">
        <span class="val" id="ink-color-val">#0E0D0B</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>BREED</h4>
    <div class="breed-selector">
      <label class="breed-radio">
        <input type="radio" name="breed" value="raster_vertical">
        <span>RASTER VERTICAL</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="stipple">
        <span>STIPPLE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="halftone" checked>
        <span>HALFTONE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="riso_noise">
        <span>RISO NOISE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="color_blocking">
        <span>COLOR BLOCKING</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="outline">
        <span>OUTLINE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="color_cluster">
        <span>COLOR CLUSTER</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-raster_vertical">
      <label>
        <span class="name">SPACING</span>
        <input type="range" id="raster-spacing" min="0.8" max="3.0" step="0.05" value="1.6">
        <span class="val" id="raster-spacing-val">1.60</span>
      </label>
      <label>
        <span class="name">LENGTH</span>
        <input type="range" id="raster-length" min="2" max="20" step="0.5" value="6">
        <span class="val" id="raster-length-val">6.0</span>
      </label>
      <label>
        <span class="name">COVERAGE</span>
        <input type="range" id="raster-coverage" min="0.30" max="1.00" step="0.01" value="0.85">
        <span class="val" id="raster-coverage-val">0.85</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-stipple">
      <label>
        <span class="name">DENSITY</span>
        <input type="range" id="stipple-density" min="0.02" max="0.40" step="0.005" value="0.14">
        <span class="val" id="stipple-density-val">0.140</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="stipple-dotSize" min="0.6" max="3.0" step="0.05" value="1.6">
        <span class="val" id="stipple-dotSize-val">1.60</span>
      </label>
      <label>
        <span class="name">SIZE VAR</span>
        <input type="range" id="stipple-dotVar" min="0.0" max="0.8" step="0.02" value="0.40">
        <span class="val" id="stipple-dotVar-val">0.40</span>
      </label>
      <label>
        <span class="name">COVERAGE</span>
        <input type="range" id="stipple-coverage" min="0.30" max="1.00" step="0.01" value="0.85">
        <span class="val" id="stipple-coverage-val">0.85</span>
      </label>
    </div>

    <div class="panel-grid breed-params active" id="params-halftone">
      <label>
        <span class="name">CELL SIZE</span>
        <input type="range" id="ht-cell" min="3" max="18" step="0.25" value="6">
        <span class="val" id="ht-cell-val">6.00</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="ht-dotSize" min="0.30" max="1.00" step="0.01" value="0.85">
        <span class="val" id="ht-dotSize-val">0.85</span>
      </label>
      <label>
        <span class="name">COVERAGE</span>
        <input type="range" id="ht-coverage" min="0.30" max="1.00" step="0.01" value="0.85">
        <span class="val" id="ht-coverage-val">0.85</span>
      </label>
      <label>
        <span class="name">JITTER</span>
        <input type="range" id="ht-jitter" min="0" max="1.5" step="0.01" value="0.00">
        <span class="val" id="ht-jitter-val">0.00</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-riso_noise">
      <label>
        <span class="name">DENSITY</span>
        <input type="range" id="riso-density" min="0.02" max="0.40" step="0.005" value="0.13">
        <span class="val" id="riso-density-val">0.130</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="riso-dotSize" min="0.6" max="3.0" step="0.05" value="1.4">
        <span class="val" id="riso-dotSize-val">1.40</span>
      </label>
      <label>
        <span class="name">SIZE VAR</span>
        <input type="range" id="riso-dotVar" min="0.0" max="0.8" step="0.02" value="0.40">
        <span class="val" id="riso-dotVar-val">0.40</span>
      </label>
      <label>
        <span class="name">MISREG</span>
        <input type="range" id="riso-misreg" min="0" max="4" step="0.1" value="1.5">
        <span class="val" id="riso-misreg-val">1.5</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-color_blocking">
      <label>
        <span class="name">DENSITY</span>
        <input type="range" id="cb-density" min="0.05" max="0.60" step="0.005" value="0.22">
        <span class="val" id="cb-density-val">0.220</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="cb-dotSize" min="0.6" max="3.0" step="0.05" value="1.3">
        <span class="val" id="cb-dotSize-val">1.30</span>
      </label>
      <label>
        <span class="name">SIZE VAR</span>
        <input type="range" id="cb-dotVar" min="0.0" max="0.8" step="0.02" value="0.35">
        <span class="val" id="cb-dotVar-val">0.35</span>
      </label>
      <label>
        <span class="name">SHADING</span>
        <input type="range" id="cb-shading" min="0.0" max="1.0" step="0.01" value="0.30">

<script type="module">

import * as THREE from 'three';

const DEG2RAD = Math.PI / 180;

const DEFAULTS = {
  species: "basalt",
  breed:   "halftone",

  geometry: {
    type:      "basalt",
    colsX:     4,
    colsZ:     3,
    colSize:   0.30,
    heightBase: 1.20,
    heightVar: 0.40,
    gap:       0.03,
    rotation:  [0, 0, 0]
  },

  camera: {
    fov:      32,
    position: [1.50, 1.80, 3.00],
    target:   [0, 0.3, 0]
  },

  light: {
    keyIntensity: 1.30,
    direction:    [-0.60, 1.00, 0.50],
    ambient:      0.10
  },

  tone: {
    blackPoint: 0.0,
    whitePoint: 1.0,
    gamma:      1.0
  },

  polarity: "positive",
  fillLuma: 0.00,

  breeds: {
    raster_vertical: {
      spacing: 1.6, segmentLen: 6, jitterX: 0.4,
      weightBase: 1.0, weightVar: 0.35, lumaWeight: 0.40, coverage: 0.85
    },
    stipple: {
      density: 0.14, dotSizeBase: 1.6, dotSizeVar: 0.40,
      jitter: 0.5, coverage: 0.85
    },
    halftone: {
      cellSize:  6.00,
      dotSize:   0.85,
      coverage:  0.85,
      jitter:    0.00
    },
    riso_noise: {
      density: 0.13, dotSizeBase: 1.4, dotSizeVar: 0.40,
      jitter: 0.5, misreg: 1.5,
      layers: [
        { color: [20, 18, 14, 220],    offset: [0.0, 0.0],   densityMult: 0.45, lumaResponse:  0.65 },
        { color: [180, 140, 100, 225],  offset: [-1.0, -0.5], densityMult: 0.80, lumaResponse: -0.30 },
        { color: [90, 80, 70, 220],     offset: [0.8, 1.0],   densityMult: 0.60, lumaResponse:  0.20 },
        { color: [60, 100, 165, 230],   offset: [1.8, 0.8],   densityMult: 0.50, lumaResponse:  0.50 }
      ]
    },
    color_blocking: {
      density:      0.22,
      dotSizeBase:  1.3,
      dotSizeVar:   0.35,
      jitter:       0.4,
      shading:      0.30,
      defaultColor: [180, 140, 100, 235],
      regions: [
        { dirX: 0, dirY:  1, dirZ:  0, threshold: 0.50, color: [90, 80, 70, 230] },
        { dirX: 0, dirY:  0, dirZ:  1, threshold: 0.45, color: [140, 120, 95, 235] },
        { dirX: 1, dirY:  0, dirZ:  0, threshold: 0.45, color: [110, 95, 80, 235] },
        { dirX: 0, dirY:  0, dirZ: -1, threshold: 0.45, color: [60, 55, 48, 220] }
      ]
    },
    outline: {
      weight: 1.5,
      jitter: 0.00,
      mode: "boundary",
      threshold: 0.70
    },
    color_cluster: {
      count: 300,
      size: 8,
      sizeVar: 0.50,
      circlePct: 100,
      quadPct: 0,
      trianglePct: 0,
      rotation: 0,
      opacity: 1.0,
      baseColor: [0, 60, 50],
      harmony: "triadic",
      darkMix: 0.0,
      lumaResponse: 0.0,
      noiseFreq: 0.02,
      noiseStrength: 0.0,
      scatter: 0
    }
  },

  paperGrain: 0.55,
  inkColor:   [14, 13, 11],
  inkAlpha:   232,

  seed: 1138,
  geomSeed: 1138
};

const SPECIMEN = JSON.parse(JSON.stringify(DEFAULTS));

const CANVAS_W = 560;
const CANVAS_H = 420;

/* ---------- Seeded RNG ---------- */

function makeSeededRandom(seed) {
  let s = seed >>> 0;
  return function() {
    s = Math.imul(s, 1664525) + 1013904223 | 0;
    return (s >>> 0) / 4294967296;
  };
}

/* ---------- Basalt geometry ---------- */

function buildBasaltGeometry(g, geomSeed) {
  const rng = makeSeededRandom(geomSeed);
  const colsX = Math.max(1, Math.round(g.colsX));
  const colsZ = Math.max(1, Math.round(g.colsZ));
  const step = g.colSize + g.gap;

  const offsetX = -(colsX - 1) * step * 0.5;
  const offsetZ = -(colsZ - 1) * step * 0.5;

  let totalVerts = 0;
  const boxes = [];

  for (let iz = 0; iz < colsZ; iz++) {
    for (let ix = 0; ix < colsX; ix++) {
      const hRand = 1 - g.heightVar + rng() * g.heightVar * 2;
      const h = Math.max(0.02, g.heightBase * hRand);
      const indexed = new THREE.BoxGeometry(g.colSize, h, g.colSize);
      const box = indexed.toNonIndexed();
      indexed.dispose();
      const m = new THREE.Matrix4();
      m.makeTranslation(
        offsetX + ix * step,
        h * 0.5,
        offsetZ + iz * step
      );
      box.applyMatrix4(m);
      totalVerts += box.attributes.position.count;
      boxes.push(box);
    }
  }

  const positions = new Float32Array(totalVerts * 3);
  const normals = new Float32Array(totalVerts * 3);
  let offset = 0;

  for (const box of boxes) {
    const count = box.attributes.position.count;
    positions.set(box.attributes.position.array.subarray(0, count * 3), offset * 3);
    normals.set(box.attributes.normal.array.subarray(0, count * 3), offset * 3);
    offset += count;
    box.dispose();
  }

  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  merged.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  return merged;
}

/* ---------- Persistent three.js scene ---------- */

const _renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
_renderer.setPixelRatio(1);
_renderer.setSize(CANVAS_W, CANVAS_H);
_renderer.setClearColor(0x000000, 0);

const _scene = new THREE.Scene();
const _camera = new THREE.PerspectiveCamera(SPECIMEN.camera.fov, CANVAS_W / CANVAS_H, 0.1, 100);

const _litMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.9, side: THREE.DoubleSide
});

const _normalMaterial = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec3 vObjectNormal;
    void main() {
      vObjectNormal = normal;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vObjectNormal;
    void main() {
      gl_FragColor = vec4(normalize(vObjectNormal) * 0.5 + 0.5, 1.0);
    }
  `
});

const _mesh = new THREE.Mesh(buildBasaltGeometry(SPECIMEN.geometry, SPECIMEN.geomSeed), _litMaterial);
_scene.add(_mesh);

const _keyLight = new THREE.DirectionalLight(0xffffff, SPECIMEN.light.keyIntensity);
_scene.add(_keyLight);

const _ambient = new THREE.AmbientLight(0xffffff, SPECIMEN.light.ambient);
_scene.add(_ambient);

const _litReadCanvas = document.createElement('canvas');
_litReadCanvas.width = CANVAS_W; _litReadCanvas.height = CANVAS_H;
const _litReadCtx = _litReadCanvas.getContext('2d');

const _normalReadCanvas = document.createElement('canvas');
_normalReadCanvas.width = CANVAS_W; _normalReadCanvas.height = CANVAS_H;
const _normalReadCtx = _normalReadCanvas.getContext('2d');

const _silhouette = new Uint8Array(CANVAS_W * CANVAS_H);
const _luma = new Float32Array(CANVAS_W * CANVAS_H);
const _normals = new Float32Array(CANVAS_W * CANVAS_H * 3);

let _lastGeomKey = '';

const formData = {
  silhouette: _silhouette, luma: _luma, normals: _normals,
  W: CANVAS_W, H: CANVAS_H,
  lumaMin: 0, lumaMax: 1, lumaMean: 0.5
};

function geomKey() {
  const g = SPECIMEN.geometry;
  return `${g.colsX},${g.colsZ},${g.colSize},${g.heightBase},${g.heightVar},${g.gap},${SPECIMEN.geomSeed}`;
}

function renderFormPass() {
  _camera.position.set(...SPECIMEN.camera.position);
  _camera.fov = SPECIMEN.camera.fov;
  _camera.lookAt(...SPECIMEN.camera.target);
  _camera.updateProjectionMatrix();

  _keyLight.position.set(...SPECIMEN.light.direction);
  _keyLight.intensity = SPECIMEN.light.keyIntensity;
  _ambient.intensity = SPECIMEN.light.ambient;

  _mesh.rotation.set(
    SPECIMEN.geometry.rotation[0] * DEG2RAD,
    SPECIMEN.geometry.rotation[1] * DEG2RAD,
    SPECIMEN.geometry.rotation[2] * DEG2RAD
  );

  const key = geomKey();
  if (key !== _lastGeomKey) {
    _mesh.geometry.dispose();
    _mesh.geometry = buildBasaltGeometry(SPECIMEN.geometry, SPECIMEN.geomSeed);
    _lastGeomKey = key;
  }

  const total = CANVAS_W * CANVAS_H;

  _mesh.material = _litMaterial;
  _renderer.render(_scene, _camera);
  _litReadCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  _litReadCtx.drawImage(_renderer.domElement, 0, 0);
  const litImg = _litReadCtx.getImageData(0, 0, CANVAS_W, CANVAS_H);

  let minL = 1, maxL = 0, sumL = 0, count = 0;
  for (let i = 0; i < total; i++) {
    const r  = litImg.data[i * 4];
    const gg = litImg.data[i * 4 + 1];
    const b  = litImg.data[i * 4 + 2];
    const a  = litImg.data[i * 4 + 3];
    if (a > 24) {
      _silhouette[i] = 1;
      const l = (0.299 * r + 0.587 * gg + 0.114 * b) / 255;
      _luma[i] = l;
      if (l < minL) minL = l;
      if (l > maxL) maxL = l;
      sumL += l;
      count++;
    } else {
      _silhouette[i] = 0;
      _luma[i] = 0;
    }
  }
  formData.lumaMin  = count ? minL : 0;
  formData.lumaMax  = count ? maxL : 0;
  formData.lumaMean = count ? sumL / count : 0;

  _mesh.material = _normalMaterial;
  _renderer.render(_scene, _camera);
  _normalReadCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  _normalReadCtx.drawImage(_renderer.domElement, 0, 0);
  const normalImg = _normalReadCtx.getImageData(0, 0, CANVAS_W, CANVAS_H);

  for (let i = 0; i < total; i++) {
    if (_silhouette[i] === 0) {
      _normals[i * 3]     = 0;
      _normals[i * 3 + 1] = 0;
      _normals[i * 3 + 2] = 0;
      continue;
    }
    _normals[i * 3]     = (normalImg.data[i * 4]     / 255) * 2 - 1;
    _normals[i * 3 + 1] = (normalImg.data[i * 4 + 1] / 255) * 2 - 1;
    _normals[i * 3 + 2] = (normalImg.data[i * 4 + 2] / 255) * 2 - 1;
  }

  _mesh.material = _litMaterial;
}

/* ---------- Polarity pass ---------- */

function applyPolarity() {
  if (SPECIMEN.polarity !== "negative") return;
  const total = CANVAS_W * CANVAS_H;
  const fill = SPECIMEN.fillLuma;
  let minL = fill, maxL = fill, sumL = 0, count = 0;
  for (let i = 0; i < total; i++) {
    if (_silhouette[i] === 1) {
      _silhouette[i] = 0;
      _luma[i] = 0;
      _normals[i * 3] = 0;
      _normals[i * 3 + 1] = 0;
      _normals[i * 3 + 2] = 0;
    } else {
      _silhouette[i] = 1;
      _luma[i] = fill;
      sumL += fill;
      count++;
    }
  }
  formData.lumaMin  = count ? minL : 0;
  formData.lumaMax  = count ? maxL : 0;
  formData.lumaMean = count ? sumL / count : 0;
}

/* ---------- Tone pass ---------- */

function applyTone(rawLuma, tone) {
  const range = tone.whitePoint - tone.blackPoint;
  if (range <= 0) return 0;
  let l = (rawLuma - tone.blackPoint) / range;
  if (l < 0) l = 0;
  else if (l > 1) l = 1;
  return Math.pow(l, tone.gamma);
}

/* ---------- Breed pass ---------- */

let myP5;
let currentSeed = SPECIMEN.seed;

const sketch = (p) => {
  let pPaper = null;

  p.setup = function() {
    const c = p.createCanvas(CANVAS_W, CANVAS_H);
    c.parent('sketch');
    p.noLoop();
    pPaper = buildPaperTexture(p);
    renderSpecimen(p, pPaper);
  };

  p.regenerate = function(newSeed) {
    if (newSeed !== undefined) currentSeed = newSeed;
    renderSpecimen(p, pPaper);
  };

  p.savePng = function() {
    p.saveCanvas(`basalt-${SPECIMEN.breed}-v1`, 'png');
  };
};

function renderSpecimen(p, paper) {
  p.randomSeed(currentSeed);
  p.noiseSeed(currentSeed);
  drawPaper(p, paper);
  drawBreedFromForm(p, SPECIMEN, formData);
  drawGrainOverlay(p);
  drawFrameEdge(p);
}

function buildPaperTexture(p) {
  const buf = p.createGraphics(CANVAS_W, CANVAS_H);
  buf.pixelDensity(1);
  buf.noiseSeed(1234);
  buf.loadPixels();
  for (let y = 0; y < buf.height; y++) {
    for (let x = 0; x < buf.width; x++) {
      const n = buf.noise(x * 0.04, y * 0.04);
      const v = 232 + (n - 0.5) * 18;
      const i = 4 * (y * buf.width + x);
      buf.pixels[i]     = v;
      buf.pixels[i + 1] = v - 4;
      buf.pixels[i + 2] = v - 12;
      buf.pixels[i + 3] = 255;
    }
  }
  buf.updatePixels();
  return buf;
}

function drawPaper(p, paper) {
  p.image(paper, 0, 0);
  p.noStroke();
  for (let i = 0; i < 220; i++) {
    p.fill(40, 36, 30, p.random(8, 22));
    p.rect(p.random(p.width), p.random(p.height), p.random(1, 1.6), p.random(1, 1.6));
  }
}

function drawBreedFromForm(p, s, form) {
  const params = s.breeds[s.breed];
  if      (s.breed === "raster_vertical") drawRasterFromForm(p, s, params, form);
  else if (s.breed === "stipple")         drawStippleFromForm(p, s, params, form);
  else if (s.breed === "halftone")        drawHalftoneFromForm(p, s, params, form);
  else if (s.breed === "riso_noise")      drawRisoNoiseFromForm(p, s, params, form);
  else if (s.breed === "color_blocking")  drawColorBlockingFromForm(p, s, params, form);
  else if (s.breed === "outline")         drawOutlineFromForm(p, s, params, form);
  else if (s.breed === "color_cluster")   drawColorClusterFromForm(p, s, params, form);
}

function drawRasterFromForm(p, s, sp, form) {
  const { silhouette, W: fW, H: fH } = form;
  p.stroke(s.inkColor[0], s.inkColor[1], s.inkColor[2], s.inkAlpha);
  for (let cx = 0; cx < p.width; cx += sp.spacing) {
    const fx = Math.floor(cx);
    if (fx < 0 || fx >= fW) continue;
    let runStart = -1;
    for (let fy = 0; fy <= fH; fy++) {
      const inForm = fy < fH ? silhouette[fy * fW + fx] === 1 : false;
      if (inForm && runStart < 0) {
        runStart = fy;
      } else if (!inForm && runStart >= 0) {
        drawRasterColumnRun(p, s, sp, fx, runStart, fy - 1, form, cx);
        runStart = -1;
      }
    }
  }
}

function drawRasterColumnRun(p, s, sp, fx, fyStart, fyEnd, form, cxBase) {
  const tone = s.tone;
  const segLen = sp.segmentLen;
  const jitterRange = Math.max(1.5, segLen * 0.25);
  const jx = p.random(-sp.jitterX, sp.jitterX);
  let fy = fyStart;
  while (fy < fyEnd) {
    const fySegEnd = Math.min(fy + segLen + p.random(-jitterRange, jitterRange), fyEnd);
    const fyMid = Math.floor((fy + fySegEnd) / 2);
    const lIdx = fyMid * form.W + fx;
    const l = applyTone(form.luma[lIdx], tone);
    const dropP = l * (sp.coverage || 1);
    if (p.random() > dropP) {
      const baseW = sp.weightBase * (1 + p.random(-sp.weightVar, sp.weightVar));
      const lumaWeightMult = 1.15 - l * sp.lumaWeight;
      p.strokeWeight(Math.max(0.4, baseW * lumaWeightMult));
      const cy1 = fy + p.random(-0.3, 0.3);
      const cy2 = fySegEnd + p.random(-0.3, 0.3);
      const cxJ1 = cxBase + jx + p.random(-0.25, 0.25);
      const cxJ2 = cxBase + jx + p.random(-0.25, 0.25);
      p.line(cxJ1, cy1, cxJ2, cy2);
    }
    fy = fySegEnd + p.random(0, Math.max(0.4, segLen * 0.1));
  }
}

function drawStippleFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();
  for (let y = 0; y < fH; y++) {
    for (let x = 0; x < fW; x++) {
      const idx = y * fW + x;
      if (silhouette[idx] !== 1) continue;
      const l = applyTone(luma[idx], tone);
      const localDensity = sp.density * (1 - l * (sp.coverage || 1));
      if (p.random() > localDensity) continue;
      const jx = p.random(-sp.jitter, sp.jitter);
      const jy = p.random(-sp.jitter, sp.jitter);
      const dotSize = sp.dotSizeBase * (1 + p.random(-sp.dotSizeVar, sp.dotSizeVar));
      const alpha = s.inkAlpha * (1 - l * 0.18);
      p.fill(s.inkColor[0], s.inkColor[1], s.inkColor[2], alpha);
      p.circle(x + jx, y + jy, Math.max(0.4, dotSize));
    }
  }
}

function drawHalftoneFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();
  p.fill(s.inkColor[0], s.inkColor[1], s.inkColor[2], s.inkAlpha);
  const cell = Math.max(1, sp.cellSize);
  const halfCell = cell * 0.5;
  const dotMax = cell * sp.dotSize;
  const useJitter = sp.jitter > 0;
  for (let cy = halfCell; cy < fH; cy += cell) {
    for (let cx = halfCell; cx < fW; cx += cell) {
      const fx = Math.floor(cx);
      const fy = Math.floor(cy);
      const idx = fy * fW + fx;
      if (silhouette[idx] !== 1) continue;
      const l = applyTone(luma[idx], tone);
      const diameter = dotMax * (1 - l * sp.coverage);
      if (diameter < 0.3) continue;
      let dx = 0, dy = 0;
      if (useJitter) {
        dx = p.random(-sp.jitter, sp.jitter);
        dy = p.random(-sp.jitter, sp.jitter);
      }
      p.circle(cx + dx, cy + dy, diameter);
    }
  }
}

function drawRisoNoiseFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();
  for (const layer of sp.layers) {
    p.fill(layer.color[0], layer.color[1], layer.color[2], layer.color[3]);
    const offX = layer.offset[0] * sp.misreg;
    const offY = layer.offset[1] * sp.misreg;
    for (let y = 0; y < fH; y++) {
      for (let x = 0; x < fW; x++) {
        const idx = y * fW + x;
        if (silhouette[idx] !== 1) continue;
        const l = applyTone(luma[idx], tone);
        let layerDensity = sp.density * layer.densityMult * (1 - l * layer.lumaResponse);
        if (layerDensity <= 0) continue;
        if (layerDensity > 1) layerDensity = 1;
        if (p.random() > layerDensity) continue;
        const jx = p.random(-sp.jitter, sp.jitter) + offX;
        const jy = p.random(-sp.jitter, sp.jitter) + offY;
        const dotSize = sp.dotSizeBase * (1 + p.random(-sp.dotSizeVar, sp.dotSizeVar));
        p.circle(x + jx, y + jy, Math.max(0.4, dotSize));
      }
    }
  }
}

function drawColorBlockingFromForm(p, s, sp, form) {
  const { silhouette, luma, normals, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();
  for (let y = 0; y < fH; y++) {
    for (let x = 0; x < fW; x++) {
      const idx = y * fW + x;
      if (silhouette[idx] !== 1) continue;
      const l = applyTone(luma[idx], tone);
      const ni = idx * 3;
      const nx = normals[ni], ny = normals[ni + 1], nz = normals[ni + 2];
      let color = sp.defaultColor;
      for (const region of sp.regions) {
        const dot = nx * region.dirX + ny * region.dirY + nz * region.dirZ;
        if (dot > region.threshold) { color = region.color; break; }
      }
      const shadeMod = 1 - l * sp.shading;
      const density = sp.density * Math.max(0, shadeMod);
      if (p.random() > density) continue;
      const jx = p.random(-sp.jitter, sp.jitter);
      const jy = p.random(-sp.jitter, sp.jitter);
      const dotSize = sp.dotSizeBase * (1 + p.random(-sp.dotSizeVar, sp.dotSizeVar));
      const alpha = color[3] * (1 - l * sp.shading * 0.5);
      p.fill(color[0], color[1], color[2], Math.max(20, alpha));
      p.circle(x + jx, y + jy, Math.max(0.4, dotSize));
    }
  }
}

function drawOutlineFromForm(p, s, sp, form) {
  const { silhouette, normals, W: fW, H: fH } = form;
  p.noStroke();
  p.fill(s.inkColor[0], s.inkColor[1], s.inkColor[2], s.inkAlpha);
  const weight = sp.weight;
  const useJitter = sp.jitter > 0;
  const mode = sp.mode || "boundary";
  const thresh = sp.threshold || 0.70;
  const doBoundary = mode === "boundary" || mode === "both";
  const doFaces = mode === "faces" || mode === "both";

  for (let y = 0; y < fH; y++) {
    for (let x = 0; x < fW; x++) {
      const idx = y * fW + x;
      if (silhouette[idx] !== 1) continue;

      let isEdge = false;

      if (doBoundary) {
        const left  = x > 0      ? silhouette[idx - 1]  : 0;
        const right = x < fW - 1 ? silhouette[idx + 1]  : 0;
        const up    = y > 0      ? silhouette[idx - fW]  : 0;
        const down  = y < fH - 1 ? silhouette[idx + fW]  : 0;
        if (!left || !right || !up || !down) isEdge = true;
      }

      if (!isEdge && doFaces) {
        const ni = idx * 3;
        const nx = normals[ni], ny = normals[ni + 1], nz = normals[ni + 2];
        if (x > 0 && silhouette[idx - 1]) {
          const nj = (idx - 1) * 3;
          if (nx * normals[nj] + ny * normals[nj + 1] + nz * normals[nj + 2] < thresh) isEdge = true;
        }
        if (!isEdge && x < fW - 1 && silhouette[idx + 1]) {
          const nj = (idx + 1) * 3;
          if (nx * normals[nj] + ny * normals[nj + 1] + nz * normals[nj + 2] < thresh) isEdge = true;
        }
        if (!isEdge && y > 0 && silhouette[idx - fW]) {
          const nj = (idx - fW) * 3;
          if (nx * normals[nj] + ny * normals[nj + 1] + nz * normals[nj + 2] < thresh) isEdge = true;
        }
        if (!isEdge && y < fH - 1 && silhouette[idx + fW]) {
          const nj = (idx + fW) * 3;
          if (nx * normals[nj] + ny * normals[nj + 1] + nz * normals[nj + 2] < thresh) isEdge = true;
        }
      }

      if (!isEdge) continue;

      let jx = 0, jy = 0;
      if (useJitter) {
        jx = p.random(-sp.jitter, sp.jitter);
        jy = p.random(-sp.jitter, sp.jitter);
      }
      p.circle(x + jx, y + jy, weight);
    }
  }
}

/* ---------- Breed: color cluster ---------- */

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (h < 60)  { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  if (max === min) return [0, 0, Math.round(l * 100)];
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if      (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else                h = ((r - g) / d + 4) / 6;
  return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
}

function generatePalette(baseH, baseS, baseL, harmony) {
  const wrap = h => ((h % 360) + 360) % 360;
  let colors;
  switch (harmony) {
    case "complementary":
      colors = [[baseH, baseS, baseL], [wrap(baseH + 180), baseS, baseL]]; break;
    case "analogous":
      colors = [[wrap(baseH - 30), baseS, baseL], [baseH, baseS, baseL], [wrap(baseH + 30), baseS, baseL]]; break;
    case "monochromatic":
      colors = [[baseH, baseS, Math.max(10, baseL - 20)], [baseH, baseS, baseL], [baseH, baseS, Math.min(90, baseL + 20)]]; break;
    case "triadic":
      colors = [[baseH, baseS, baseL], [wrap(baseH + 120), baseS, baseL], [wrap(baseH + 240), baseS, baseL]]; break;
    case "tetradic":
      colors = [[baseH, baseS, baseL], [wrap(baseH + 90), baseS, baseL], [wrap(baseH + 180), baseS, baseL], [wrap(baseH + 270), baseS, baseL]]; break;
    case "accented_analogous":
      colors = [[wrap(baseH - 30), baseS, baseL], [baseH, baseS, baseL], [wrap(baseH + 30), baseS, baseL], [wrap(baseH + 180), baseS, baseL]]; break;
    default:
      colors = [[baseH, baseS, baseL]];
  }
  return colors.map(([h, s, l]) => hslToRgb(h, s, l));
}

function updatePalettePreview() {
  const container = document.getElementById('cc-palette-preview');
  if (!container) return;
  const sp = SPECIMEN.breeds.color_cluster;
  const palette = generatePalette(sp.baseColor[0], sp.baseColor[1], sp.baseColor[2], sp.harmony);
  container.innerHTML = '';
  for (const [r, g, b] of palette) {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = `rgb(${r},${g},${b})`;
    container.appendChild(sw);
  }
  if (sp.darkMix > 0) {
    const dark = hslToRgb(sp.baseColor[0], sp.baseColor[1], 10);
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = `rgb(${dark[0]},${dark[1]},${dark[2]})`;
    container.appendChild(sw);
  }
}

function pickShape(p, sp) {
  const total = sp.circlePct + sp.quadPct + sp.trianglePct;
  if (total <= 0) return "circle";
  const r = p.random(total);
  if (r < sp.circlePct) return "circle";
  if (r < sp.circlePct + sp.quadPct) return "quad";
  return "triangle";
}

function buildDistanceField(silhouette, W, H) {
  const dist = new Float32Array(W * H);
  const INF = 1e6;
  for (let i = 0; i < W * H; i++) dist[i] = silhouette[i] === 1 ? 0 : INF;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (dist[i] === 0) continue;
      if (x > 0)              dist[i] = Math.min(dist[i], dist[i - 1] + 1);
      if (y > 0)              dist[i] = Math.min(dist[i], dist[(y-1)*W + x] + 1);
      if (x > 0 && y > 0)    dist[i] = Math.min(dist[i], dist[(y-1)*W + x - 1] + 1.414);
      if (x < W-1 && y > 0)  dist[i] = Math.min(dist[i], dist[(y-1)*W + x + 1] + 1.414);
    }
  }
  for (let y = H - 1; y >= 0; y--) {
    for (let x = W - 1; x >= 0; x--) {
      const i = y * W + x;
      if (dist[i] === 0) continue;
      if (x < W-1)              dist[i] = Math.min(dist[i], dist[i + 1] + 1);
      if (y < H-1)              dist[i] = Math.min(dist[i], dist[(y+1)*W + x] + 1);
      if (x < W-1 && y < H-1)  dist[i] = Math.min(dist[i], dist[(y+1)*W + x + 1] + 1.414);
      if (x > 0 && y < H-1)    dist[i] = Math.min(dist[i], dist[(y+1)*W + x - 1] + 1.414);
    }
  }
  return dist;
}

function drawColorClusterFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();
  const palette = generatePalette(sp.baseColor[0], sp.baseColor[1], sp.baseColor[2], sp.harmony);
  const darkColor = hslToRgb(sp.baseColor[0], sp.baseColor[1], 10);
  const alpha = Math.round(sp.opacity * 255);
  const useNoise = sp.noiseStrength > 0;
  const useScatter = sp.scatter > 0;
  const dist = useScatter ? buildDistanceField(silhouette, fW, fH) : null;
  const maxAttempts = sp.count * 10;
  let placed = 0;

  for (let attempt = 0; attempt < maxAttempts && placed < sp.count; attempt++) {
    const x = Math.floor(p.random(fW));
    const y = Math.floor(p.random(fH));
    const idx = y * fW + x;
    const inside = silhouette[idx] === 1;

    if (!inside) {
      if (!useScatter) continue;
      const d = dist[idx];
      if (d > sp.scatter) continue;
      const falloff = 1 - (d / sp.scatter);
      if (p.random() > falloff * falloff) continue;
    }

    if (useNoise) {
      const n = p.noise(x * sp.noiseFreq, y * sp.noiseFreq);
      if (p.random() > n * sp.noiseStrength + (1 - sp.noiseStrength)) continue;
    }

    if (inside && sp.lumaResponse > 0) {
      const l = applyTone(luma[idx], tone);
      if (p.random() < l * sp.lumaResponse) continue;
    }

    const isDark = sp.darkMix > 0 && p.random() < sp.darkMix;
    const color = isDark ? darkColor : palette[Math.floor(p.random(palette.length))];
    p.fill(color[0], color[1], color[2], alpha);

    const sizeMult = 1 - sp.sizeVar + p.random() * sp.sizeVar * 2;
    const markSize = Math.max(0.5, sp.size * sizeMult);
    const shape = pickShape(p, sp);

    if (shape === "circle") {
      p.circle(x, y, markSize);
    } else {
      const rot = sp.rotation > 0 ? p.random(-sp.rotation, sp.rotation) * Math.PI / 180 : 0;
      p.push();
      p.translate(x, y);
      if (rot !== 0) p.rotate(rot);
      if (shape === "quad") {
        const half = markSize / 2;
        p.rect(-half, -half, markSize, markSize);
      } else {
        const r = markSize / 2;
        p.triangle(0, -r, -r * 0.866, r * 0.5, r * 0.866, r * 0.5);
      }
      p.pop();
    }
    placed++;
  }
}

function drawGrainOverlay(p) {
  p.noStroke();
  for (let i = 0; i < 850; i++) {
    p.fill(20, 18, 14, p.random(6, 16));
    p.rect(p.random(p.width), p.random(p.height), 1, 1);

    p.rect(p.random(p.width), p.random(p.height), 1, 1);
  }
}

function drawFrameEdge(p) {
  p.noFill();
  p.stroke(20, 18, 14, 22);
  p.strokeWeight(1);
  p.rect(0.5, 0.5, p.width - 1, p.height - 1);
}

/* ---------- Update orchestration ---------- */

let _formScheduled = false;
let _breedScheduled = false;

function scheduleFormUpdate() {
  if (_formScheduled) return;
  _formScheduled = true;
  requestAnimationFrame(() => {
    _formScheduled = false;
    renderFormPass();
    applyPolarity();
    updateDebugCanvas();
    updateLumaReadout();
    scheduleBreedUpdate();
    updateSpecimenView();
  });
}

function scheduleBreedUpdate() {
  if (_breedScheduled) return;
  _breedScheduled = true;
  requestAnimationFrame(() => {
    _breedScheduled = false;
    if (myP5) myP5.regenerate();
    updateToneCurve();
    updateSpecimenView();
  });
}

function updateDebugCanvas() {
  const slotLit = document.getElementById('threeDebugSlotLit');
  let dispLit = slotLit.querySelector('canvas');
  if (!dispLit) {
    dispLit = document.createElement('canvas');
    dispLit.width = CANVAS_W; dispLit.height = CANVAS_H;
    slotLit.appendChild(dispLit);
  }
  const ctxLit = dispLit.getContext('2d');
  ctxLit.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctxLit.drawImage(_litReadCanvas, 0, 0);

  const slotNorm = document.getElementById('threeDebugSlotNormal');
  let dispNorm = slotNorm.querySelector('canvas');
  if (!dispNorm) {
    dispNorm = document.createElement('canvas');
    dispNorm.width = CANVAS_W; dispNorm.height = CANVAS_H;
    slotNorm.appendChild(dispNorm);
  }
  const ctxNorm = dispNorm.getContext('2d');
  ctxNorm.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctxNorm.drawImage(_normalReadCanvas, 0, 0);
}

function updateLumaReadout() {
  const r = document.getElementById('luma-readout');
  r.textContent = `LUMA ${formData.lumaMin.toFixed(2)} · ${formData.lumaMean.toFixed(2)} · ${formData.lumaMax.toFixed(2)}`;
}

function updateToneCurve() {
  const path = document.getElementById('tone-curve-path');
  if (!path) return;
  const W = 48, H = 24, N = 32;
  let d = '';
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    const y = applyTone(x, SPECIMEN.tone);
    d += (i === 0 ? 'M' : 'L') + (x * W).toFixed(2) + ',' + (H - y * H).toFixed(2) + ' ';
  }
  path.setAttribute('d', d.trim());
}

function updateSpecimenView() {
  const view = {
    species:  SPECIMEN.species,
    breed:    SPECIMEN.breed,
    geometry: SPECIMEN.geometry,
    camera:   SPECIMEN.camera,
    light:    SPECIMEN.light,
    tone:     SPECIMEN.tone,
    polarity: SPECIMEN.polarity,
    fillLuma: SPECIMEN.fillLuma,
    breeds: { [SPECIMEN.breed]: SPECIMEN.breeds[SPECIMEN.breed] },
    paperGrain: SPECIMEN.paperGrain,
    inkColor:   SPECIMEN.inkColor,
    inkAlpha:   SPECIMEN.inkAlpha,
    seed:       SPECIMEN.seed,
    geomSeed:   SPECIMEN.geomSeed
  };
  document.getElementById('specimenView').textContent = JSON.stringify(view, null, 2);
}

  const slider = document.getElementById(id);
  const valEl = document.getElementById(valId);

    mutate(v);
    valEl.textContent = fmt(v);
    if (kind === 'form') scheduleFormUpdate();
    else                 scheduleBreedUpdate();
  });
}

document.getElementById('cc-baseColor').addEventListener('input', () => {
  const hex = document.getElementById('cc-baseColor').value;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  SPECIMEN.breeds.color_cluster.baseColor = rgbToHsl(r, g, b);
  document.getElementById('cc-baseColor-val').textContent = hex.toUpperCase();
  updatePalettePreview();
  scheduleBreedUpdate();
});

  r.addEventListener('change', () => {
    SPECIMEN.breeds.color_cluster.harmony = r.value;
    updatePalettePreview();
    scheduleBreedUpdate();
  });
});

/* ---------- Breed selector ---------- */

function setBreed(breedName) {
  SPECIMEN.breed = breedName;
  document.querySelectorAll('input[name="breed"]').forEach(r => {
    r.checked = r.value === breedName;
  });
  document.querySelectorAll('.breed-params').forEach(el => {
    el.classList.toggle('active', el.id === `params-${breedName}`);
  });
  scheduleBreedUpdate();
}

document.querySelectorAll('input[name="breed"]').forEach(r => {
  r.addEventListener('change', () => setBreed(r.value));
});

/* ---------- Buttons ---------- */

document.getElementById('reseedForm').addEventListener('click', () => {
  SPECIMEN.geomSeed = Math.floor(Math.random() * 100000);
  scheduleFormUpdate();
});

document.getElementById('reseedBreed').addEventListener('click', () => {
  currentSeed = Math.floor(Math.random() * 100000);
  SPECIMEN.seed = currentSeed;
  scheduleBreedUpdate();
});

document.getElementById('savePng').addEventListener('click', () => {
  myP5.savePng();
});

document.getElementById('toggle3d').addEventListener('click', (e) => {
  const dbg = document.getElementById('threeDebug');
  if (dbg.style.display === 'none' || !dbg.style.display) {
    dbg.style.display = 'block';
    e.target.textContent = 'HIDE 3D SOURCE';
  } else {
    dbg.style.display = 'none';
    e.target.textContent = 'SHOW 3D SOURCE';
  }
});

document.getElementById('auto-levels').addEventListener('click', () => {
  const pad = 0.005;
  const newBlack = Math.max(0, formData.lumaMin - pad);
  const newWhite = Math.min(1, formData.lumaMax + pad);
  SPECIMEN.tone.blackPoint = newBlack;
  SPECIMEN.tone.whitePoint = newWhite;

  document.getElementById('tone-black').value = newBlack;
  document.getElementById('tone-black-val').textContent = fmt3(newBlack);
  document.getElementById('tone-white').value = newWhite;
  document.getElementById('tone-white-val').textContent = fmt3(newWhite);

  scheduleBreedUpdate();
});
