<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DENDRITE v1 — specimen</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:      #e8e4dc;
    --paper-deep: #d8d3c8;
    --ink:        #131210;
    --ink-soft:   #4a4640;
    --ink-faint:  #8a857c;
    --rule:       #131210;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
  }

  .workspace { display: flex; height: 100vh; }
  .sidebar { width: 380px; min-width: 380px; overflow-y: auto; padding: 30px 22px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid rgba(19,18,16,0.18); }
  .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    background-image:
      radial-gradient(rgba(19,18,16,0.04) 1px, transparent 1px),
      radial-gradient(rgba(19,18,16,0.025) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity: 0.6;
  }

  header { text-align: left; }
  header .kicker { font-size: 10px; letter-spacing: 0.22em; color: var(--ink-faint); margin-bottom: 6px; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.05em; margin: 0 0 8px 0; }
  header p { margin: 0; color: var(--ink-soft); font-size: 11px; }

  #sketch {
    border: 1px solid rgba(19,18,16,0.18);
    background: var(--paper);
    display: inline-block;
    line-height: 0;
    font-size: 0;
  }
  #sketch canvas { display: block; }

  .label { font-size: 11px; letter-spacing: 0.22em; font-weight: 500; color: var(--ink); }

  .controls-row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 8px 14px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 2px;
    cursor: pointer;
  }
  button:hover { background: var(--paper-deep); }
  button:active { transform: translateY(1px); }

  .panel {
    width: 100%;
    background: var(--paper-deep);
    border: 1px solid rgba(19,18,16,0.18);
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-group h4 {
    font-size: 9px;
    letter-spacing: 0.24em;
    color: var(--ink-faint);
    margin: 0 0 10px 0;
    font-weight: 500;
  }

  .panel-group-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; }
  .panel-group-head h4 { margin: 0; }
  .tone-meta { display: flex; align-items: center; gap: 12px; }
  .tone-curve { flex-shrink: 0; background: rgba(19,18,16,0.04); }
  .luma-readout { font-size: 9px; letter-spacing: 0.06em; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .inline-btn {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 3px 7px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 1px;
    cursor: pointer;
    line-height: 1;
  }
  .inline-btn:hover { background: var(--paper-deep); }

  .panel-grid { display: grid; grid-template-columns: 1fr; gap: 5px; }
  .panel-grid label { display: grid; grid-template-columns: 80px 1fr 44px; gap: 8px; align-items: center; font-size: 9.5px; letter-spacing: 0.1em; }
  .panel-grid .name { color: var(--ink-soft); }
  .panel-grid .val { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 1px;
    background: var(--ink);
    outline: none;
    margin: 0;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px; background: var(--ink); cursor: pointer; border: 0; border-radius: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; background: var(--ink); cursor: pointer; border: none; border-radius: 0;
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    border: 1px solid var(--ink);
    background: none;
    cursor: pointer;
    padding: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
  input[type="color"]::-webkit-color-swatch { border: none; }
  input[type="color"]::-moz-color-swatch { border: none; }

  .breed-selector { display: flex; gap: 18px; margin-bottom: 14px; font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-soft); flex-wrap: wrap; }
  .breed-radio { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .breed-radio input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    outline: none;
    cursor: pointer;
    margin: 0;
    position: relative;
    background: var(--paper);
  }
  .breed-radio input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 5px; height: 5px;
    background: var(--ink);
    border-radius: 50%;
  }
  .breed-radio input[type="radio"]:checked + span { color: var(--ink); }
  .breed-params { display: none; }
  .breed-params.active { display: grid; }

  #params-color_cluster.active {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cc-radio-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 9.5px;
    letter-spacing: 0.1em;
  }
  .cc-radio-row .name {
    color: var(--ink-soft);
    min-width: 62px;
  }
  #cc-palette-preview {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  #cc-palette-preview .swatch {
    width: 24px;
    height: 14px;
    border: 1px solid var(--ink);
  }

  #formDebug {
    display: none;
    background: var(--paper-deep);
    border: 1px solid rgba(19,18,16,0.18);
    padding: 12px;
    text-align: center;
  }
  #formDebug .dbg-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #formDebug .dbg-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #formDebug .dbg-label { font-size: 9px; letter-spacing: 0.22em; color: var(--ink-faint); }
  #formDebug canvas {
    display: block;
    max-width: 100%;
    background:
      linear-gradient(45deg, #c8c2b6 25%, transparent 25%),
      linear-gradient(-45deg, #c8c2b6 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c8c2b6 75%),
      linear-gradient(-45deg, transparent 75%, #c8c2b6 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  }

  .specimen {
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    text-align: left;
    white-space: pre;
    background: var(--paper-deep);
    border: 1px solid rgba(19,18,16,0.12);
    padding: 16px 22px;
    border-radius: 2px;
    width: 100%;
    overflow-x: auto;
  }
</style>
</head>
<body>
<div class="workspace">
<div class="sidebar">

<header>
  <div class="kicker">DENDRITE &middot; v1</div>
  <h1>Specimen</h1>
</header>

<div class="controls-row">
  <button id="reseedCurve">NEW CURVE</button>
  <button id="reseedBreed">NEW SEED</button>
  <button id="toggleDebug">SHOW FORM SOURCE</button>
  <button id="reset">RESET</button>
  <button id="savePng">SAVE PNG</button>
</div>

<div class="panel">
  <div class="panel-group">
    <h4>SHAPE · SPINE</h4>
    <div class="panel-grid">
      <label>
        <span class="name">SPINE SEGS</span>
        <input type="range" id="dn-spineSegs" min="3" max="16" step="1" value="8">
        <span class="val" id="dn-spineSegs-val">5</span>
      </label>
      <label>
        <span class="name">TRUNK WIDTH</span>
        <input type="range" id="dn-trunkWidth" min="4" max="40" step="1" value="8">
        <span class="val" id="dn-trunkWidth-val">8</span>
      </label>
      <label>
        <span class="name">CURVE BOW</span>
        <input type="range" id="dn-curveBow" min="0" max="0.50" step="0.01" value="0.25">
        <span class="val" id="dn-curveBow-val">0.25</span>
      </label>
      <label>
        <span class="name">GUIDE PTS</span>
        <input type="range" id="dn-guideCount" min="3" max="20" step="1" value="8">
        <span class="val" id="dn-guideCount-val">8</span>
      </label>
      <label>
        <span class="name">GUIDE AMP</span>
        <input type="range" id="dn-guideAmp" min="0" max="150" step="1" value="60">
        <span class="val" id="dn-guideAmp-val">60</span>
      </label>
      <label>
        <span class="name">SMOOTHING</span>
        <input type="range" id="dn-smoothing" min="0" max="1.00" step="0.01" value="0.50">
        <span class="val" id="dn-smoothing-val">0.50</span>
      </label>
      <label>
        <span class="name">NOISE MODE</span>
        <select id="dn-noiseMode">
          <option value="free" selected>free</option>
          <option value="zigzag">zigzag</option>
          <option value="drift">drift</option>
        </select>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>SHAPE · BRANCHING</h4>
    <div class="panel-grid">
      <label>
        <span class="name">DEPTH</span>
        <input type="range" id="dn-depth" min="0" max="4" step="1" value="3">
        <span class="val" id="dn-depth-val">3</span>
      </label>
      <label>
        <span class="name">BRANCH LEN</span>
        <input type="range" id="dn-branchLen" min="15" max="160" step="1" value="100">
        <span class="val" id="dn-branchLen-val">100</span>
      </label>
      <label>
        <span class="name">LEN DECAY</span>
        <input type="range" id="dn-lenDecay" min="0.30" max="0.90" step="0.01" value="0.65">
        <span class="val" id="dn-lenDecay-val">0.65</span>
      </label>
      <label>
        <span class="name">TAPER</span>
        <input type="range" id="dn-taper" min="0.30" max="0.90" step="0.01" value="0.70">
        <span class="val" id="dn-taper-val">0.70</span>
      </label>
      <label>
        <span class="name">ANGLE SPREAD</span>
        <input type="range" id="dn-angleSpread" min="0.30" max="2.50" step="0.05" value="1.30">
        <span class="val" id="dn-angleSpread-val">74&deg;</span>
      </label>
      <label>
        <span class="name">BRANCH PROB</span>
        <input type="range" id="dn-branchProb" min="0.00" max="1.00" step="0.01" value="0.75">
        <span class="val" id="dn-branchProb-val">0.75</span>
      </label>
      <label>
        <span class="name">LATERAL DENS</span>
        <input type="range" id="dn-lateralDens" min="0.00" max="1.00" step="0.01" value="0.90">
        <span class="val" id="dn-lateralDens-val">0.90</span>
      </label>
      <label>
        <span class="name">SYMMETRY</span>
        <input type="range" id="dn-symmetry" min="0.00" max="1.00" step="0.01" value="0.00">
        <span class="val" id="dn-symmetry-val">0.00</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>SHAPE · SPIKES</h4>
    <div class="panel-grid">
      <label>
        <span class="name">SPIKE FREQ</span>
        <input type="range" id="dn-spikeFreq" min="0.00" max="1.00" step="0.01" value="0.30">
        <span class="val" id="dn-spikeFreq-val">0.30</span>
      </label>
      <label>
        <span class="name">SPIKE LEN</span>
        <input type="range" id="dn-spikeLen" min="5" max="60" step="1" value="22">
        <span class="val" id="dn-spikeLen-val">22</span>
      </label>
      <label>
        <span class="name">SPIKE SHARP</span>
        <input type="range" id="dn-spikeSharp" min="0.5" max="8.0" step="0.1" value="2.5">
        <span class="val" id="dn-spikeSharp-val">2.5</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>LIGHT</h4>
    <div class="panel-grid">
      <label>
        <span class="name">LIGHT X</span>
        <input type="range" id="light-x" min="-2" max="2" step="0.01" value="0.30">
        <span class="val" id="light-x-val">0.30</span>
      </label>
      <label>
        <span class="name">LIGHT Y</span>
        <input type="range" id="light-y" min="-1" max="2" step="0.01" value="1.00">
        <span class="val" id="light-y-val">1.00</span>
      </label>
      <label>
        <span class="name">LIGHT Z</span>
        <input type="range" id="light-z" min="-2" max="2" step="0.01" value="0.45">
        <span class="val" id="light-z-val">0.45</span>
      </label>
      <label>
        <span class="name">KEY</span>
        <input type="range" id="light-key" min="0" max="3" step="0.05" value="1.20">
        <span class="val" id="light-key-val">1.20</span>
      </label>
      <label>
        <span class="name">AMBIENT</span>
        <input type="range" id="light-ambient" min="0" max="1" step="0.01" value="0.10">
        <span class="val" id="light-ambient-val">0.10</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <div class="panel-group-head">
      <h4>TONE</h4>
      <div class="tone-meta">
        <svg class="tone-curve" id="tone-curve" width="48" height="24" viewBox="0 0 48 24" preserveAspectRatio="none">
          <rect x="0.5" y="0.5" width="47" height="23" fill="none" stroke="rgba(19,18,16,0.25)" stroke-width="0.5"/>
          <line x1="0" y1="24" x2="48" y2="0" stroke="rgba(19,18,16,0.15)" stroke-width="0.5" stroke-dasharray="1,1"/>
          <path id="tone-curve-path" fill="none" stroke="#131210" stroke-width="1.2" d=""/>
        </svg>
        <span class="luma-readout" id="luma-readout">LUMA --</span>
        <button class="inline-btn" id="auto-levels">AUTO</button>
      </div>
    </div>
    <div class="panel-grid">
      <label>
        <span class="name">BLACK PT</span>
        <input type="range" id="tone-black" min="0" max="0.5" step="0.005" value="0.0">
        <span class="val" id="tone-black-val">0.000</span>
      </label>
      <label>
        <span class="name">WHITE PT</span>
        <input type="range" id="tone-white" min="0.5" max="1.0" step="0.005" value="1.0">
        <span class="val" id="tone-white-val">1.000</span>
      </label>
      <label>
        <span class="name">GAMMA</span>
        <input type="range" id="tone-gamma" min="0.30" max="3.0" step="0.01" value="1.0">
        <span class="val" id="tone-gamma-val">1.00</span>
      </label>
    </div>
  </div>

  <div class="panel-group">
    <h4>BREED</h4>
    <div class="breed-selector">
      <label class="breed-radio">
        <input type="radio" name="breed" value="raster_vertical">
        <span>RASTER VERTICAL</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="stipple">
        <span>STIPPLE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="halftone" checked>
        <span>HALFTONE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="riso_noise">
        <span>RISO NOISE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="color_blocking">
        <span>COLOR BLOCKING</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="outline">
        <span>OUTLINE</span>
      </label>
      <label class="breed-radio">
        <input type="radio" name="breed" value="color_cluster">
        <span>COLOR CLUSTER</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-raster_vertical">
      <label>
        <span class="name">SPACING</span>
        <input type="range" id="raster-spacing" min="0.8" max="3.0" step="0.05" value="1.6">
        <span class="val" id="raster-spacing-val">1.60</span>
      </label>
      <label>
        <span class="name">LENGTH</span>
        <input type="range" id="raster-length" min="2" max="20" step="0.5" value="6">
        <span class="val" id="raster-length-val">6.0</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-stipple">
      <label>
        <span class="name">DENSITY</span>
        <input type="range" id="stipple-density" min="0.02" max="0.40" step="0.005" value="0.18">
        <span class="val" id="stipple-density-val">0.180</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="stipple-dotSize" min="0.6" max="3.0" step="0.05" value="1.4">
        <span class="val" id="stipple-dotSize-val">1.40</span>
      </label>
      <label>
        <span class="name">SIZE VAR</span>
        <input type="range" id="stipple-dotVar" min="0.0" max="0.8" step="0.02" value="0.40">
        <span class="val" id="stipple-dotVar-val">0.40</span>
      </label>
    </div>

    <div class="panel-grid breed-params active" id="params-halftone">
      <label>
        <span class="name">CELL SIZE</span>
        <input type="range" id="ht-cell" min="3" max="18" step="0.25" value="6">
        <span class="val" id="ht-cell-val">6.00</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="ht-dotSize" min="0.30" max="1.00" step="0.01" value="0.85">
        <span class="val" id="ht-dotSize-val">0.85</span>
      </label>
      <label>
        <span class="name">COVERAGE</span>
        <input type="range" id="ht-coverage" min="0.30" max="1.00" step="0.01" value="0.85">
        <span class="val" id="ht-coverage-val">0.85</span>
      </label>
      <label>
        <span class="name">JITTER</span>
        <input type="range" id="ht-jitter" min="0" max="1.5" step="0.01" value="0.00">
        <span class="val" id="ht-jitter-val">0.00</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-riso_noise">
      <label>
        <span class="name">DENSITY</span>
        <input type="range" id="riso-density" min="0.02" max="0.40" step="0.005" value="0.16">
        <span class="val" id="riso-density-val">0.160</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="riso-dotSize" min="0.6" max="3.0" step="0.05" value="1.4">
        <span class="val" id="riso-dotSize-val">1.40</span>
      </label>
      <label>
        <span class="name">SIZE VAR</span>
        <input type="range" id="riso-dotVar" min="0.0" max="0.8" step="0.02" value="0.40">
        <span class="val" id="riso-dotVar-val">0.40</span>
      </label>
      <label>
        <span class="name">MISREG</span>
        <input type="range" id="riso-misreg" min="0" max="4" step="0.1" value="1.5">
        <span class="val" id="riso-misreg-val">1.5</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-color_blocking">
      <label>
        <span class="name">DENSITY</span>
        <input type="range" id="cb-density" min="0.05" max="0.60" step="0.005" value="0.25">
        <span class="val" id="cb-density-val">0.250</span>
      </label>
      <label>
        <span class="name">DOT SIZE</span>
        <input type="range" id="cb-dotSize" min="0.6" max="3.0" step="0.05" value="1.4">
        <span class="val" id="cb-dotSize-val">1.40</span>
      </label>
      <label>
        <span class="name">SHADING</span>
        <input type="range" id="cb-shading" min="0" max="1" step="0.01" value="0.30">
        <span class="val" id="cb-shading-val">0.30</span>
      </label>
    </div>

    <div class="panel-grid breed-params" id="params-outline">
      <label>
        <span class="name">WEIGHT</span>
        <input type="range" id="ol-weight" min="0.5" max="5.0" step="0.1" value="1.5">

<script>
/* =====================================================================
   SPECIMEN DENDRITE v1 -- skeleton distance field
   -----------------------------------------------------------------
   SHAPE-141. Replaces fused_bristle's chambered-chain architecture
   with a branching skeleton + per-pixel distance field. A meandering
   spine with recursive lateral branches defines the form. The distance
   field naturally produces smooth junctions (chambers emerge where
   branches meet the spine) and tapered tips. Spikes are conical field
   contributions that blend into the parent body at 0.6x field
   strength. Normals are synthesized from the tube cross-section at
   each pixel's closest skeleton point; Lambert shading produces luma
   for the breed pass. Edge softening fades marks near the silhouette
   boundary.
   ===================================================================== */

const DEFAULTS = {
  species: "dendrite",
  breed:   "halftone",

  geometry: {
    type:           "dendrite",
    spineSegments:  8,
    trunkWidth:     8,
    curveBow:       0.25,
    guideCount:     8,
    guideAmp:       60,
    smoothing:      0.50,
    noiseMode:      'free',
    depth:          3,
    branchLen:      100,
    lenDecay:       0.65,
    taper:          0.70,
    angleSpread:    1.30,
    branchProb:     0.75,
    lateralDensity: 0.90,
    symmetry:       0.00,
    spikeFreq:      0.30,
    spikeLen:       22,
    spikeSharp:     2.5,
    seed:           4271
  },

  light: {
    keyIntensity: 1.20,
    direction:    [0.30, 1.00, 0.45],
    ambient:      0.10
  },

  tone: {
    blackPoint: 0.0,
    whitePoint: 1.0,
    gamma:      1.0
  },

  breeds: {
    raster_vertical: {
      spacing:    1.6,
      segmentLen: 6,
      jitterX:    0.4,
      weightBase: 1.0,
      weightVar:  0.35,
      lumaWeight: 0.40
    },
    stipple: {
      density:     0.18,
      dotSizeBase: 1.4,
      dotSizeVar:  0.40,
      jitter:      0.5
    },
    halftone: {
      cellSize:  6.00,
      dotSize:   0.85,
      coverage:  0.85,
      jitter:    0.00
    },
    riso_noise: {
      density:     0.16,
      dotSizeBase: 1.4,
      dotSizeVar:  0.40,
      jitter:      0.5,
      misreg:      1.5,
      layers: [
        { color: [20, 18, 14, 240],   offset: [0.0, 0.0],  densityMult: 1.00, lumaResponse:  0.60 },
        { color: [232, 89, 79, 220],  offset: [1.5, -0.8], densityMult: 0.55, lumaResponse:  0.00 },
        { color: [248, 215, 88, 220], offset: [-1.2, 1.5], densityMult: 0.40, lumaResponse: -0.30 },
        { color: [64, 110, 178, 220], offset: [2.0, 1.2],  densityMult: 0.35, lumaResponse:  0.50 }
      ]
    },
    color_blocking: {
      density:     0.25,
      dotSizeBase: 1.4,
      dotSizeVar:  0.30,
      jitter:      0.5,
      shading:     0.30,
      defaultColor: [40, 36, 30, 200],
      regions: [
        { dirX: 0, dirY:  1, dirZ: 0, threshold: 0.40, color: [64, 110, 178, 220] },
        { dirX: 0, dirY: -1, dirZ: 0, threshold: 0.40, color: [58, 140, 80, 220] },
        { dirX: 0, dirY:  0, dirZ: 1, threshold: 0.65, color: [248, 215, 88, 220] }
      ]
    },
    outline: {
      weight: 1.5,
      jitter: 0.00
    },
    color_cluster: {
      count: 300,
      size: 8,
      sizeVar: 0.50,
      circlePct: 100,
      quadPct: 0,
      trianglePct: 0,
      rotation: 0,
      opacity: 1.0,
      baseColor: [0, 60, 50],
      harmony: "triadic",
      darkMix: 0.0,
      lumaResponse: 0.0,
      noiseFreq: 0.02,
      noiseStrength: 0.0,
      scatter: 0
    }
  },

  paperGrain: 0.55,
  inkAlpha:   232,

  seed: 1138
};

const SPECIMEN = JSON.parse(JSON.stringify(DEFAULTS));

const CANVAS_W = 560;
const CANVAS_H = 420;

/* ---------- Form data ---------- */

const _silhouette = new Uint8Array(CANVAS_W * CANVAS_H);
const _luma       = new Float32Array(CANVAS_W * CANVAS_H);
const _normals    = new Float32Array(CANVAS_W * CANVAS_H * 3);

const formData = {
  silhouette: _silhouette, luma: _luma, normals: _normals,
  W: CANVAS_W, H: CANVAS_H,
  lumaMin: 0, lumaMax: 1, lumaMean: 0.5
};

let _skeleton   = null;
let _bakedCurves = null;
let _spikeData   = null;

/* ---------- Utilities ---------- */

function makeSeededRandom(seed) {
  let s = (seed >>> 0) || 1;
  return function() {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function makeValueNoise(seed) {
  const N = 2048;
  let s = (seed >>> 0) || 1;
  const tbl = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    s = (s * 1664525 + 1013904223) >>> 0;
    tbl[i] = s / 4294967296;
  }
  return function(x) {
    const i = Math.floor(x);
    const f = x - i;
    const a = tbl[((i % N) + N) % N];
    const b = tbl[(((i + 1) % N) + N) % N];
    const t = f * f * (3 - 2 * f);
    return a * (1 - t) + b * t;
  };
}

/* ---------- Skeleton generation ---------- */

function addSegment(nodes, segments, fromIdx, toIdx, widthFrom, widthTo, geom, rnd) {
  const a = nodes[fromIdx];
  const b = nodes[toIdx];
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const perpX = -dy / len;
  const perpY =  dx / len;

  const bowSign = rnd() < 0.5 ? 1 : -1;
  const bow = geom.curveBow * len;
  const bow1 = bowSign * bow * (0.4 + rnd() * 0.6);
  const bow2 = bowSign * bow * (0.4 + rnd() * 0.6);

  segments.push({
    from: fromIdx,
    to:   toIdx,
    widthFrom,
    widthTo,
    cp1: { x: a.x + dx * 0.333 + perpX * bow1, y: a.y + dy * 0.333 + perpY * bow1 },
    cp2: { x: a.x + dx * 0.667 + perpX * bow2, y: a.y + dy * 0.667 + perpY * bow2 }
  });
}

function addBranch(nodes, segments, parentIdx, angle, length, width, depth, geom, rnd, mirror) {
  if (depth <= 0 || width < 1 || length < 8) return;
  if (mirror === undefined) mirror = 1;

  const parent = nodes[parentIdx];
  const endIdx = nodes.length;
  nodes.push({
    x: parent.x + Math.cos(angle) * length,
    y: parent.y + Math.sin(angle) * length
  });

  addSegment(nodes, segments, parentIdx, endIdx, width, width * geom.taper, geom, rnd);

  if (rnd() < geom.branchProb) {
    const fwdAngle = angle + mirror * (rnd() - 0.5) * 0.5;
    addBranch(nodes, segments, endIdx, fwdAngle,
              length * geom.lenDecay, width * geom.taper, depth - 1, geom, rnd, mirror);
  }

  if (rnd() < geom.branchProb * 0.5) {
    const s = rnd() < 0.5 ? -1 : 1;
    const forkAngle = angle + mirror * s * geom.angleSpread * (0.5 + rnd() * 0.5);
    addBranch(nodes, segments, endIdx, forkAngle,
              length * geom.lenDecay * 0.8, width * geom.taper, depth - 1, geom, rnd, mirror);
  }
}

function buildSkeleton(geom) {
  const rnd = makeSeededRandom(geom.seed);
  const nodes = [];
  const segments = [];

  const targetSpan = CANVAS_W * 0.55;
  const cx = CANVAS_W * 0.5;
  const cy = CANVAS_H * 0.5;
  const guideN = Math.max(3, Math.floor(geom.guideCount));
  const amp = geom.guideAmp;

  // Step 1: generate guide points along a horizontal baseline
  const guide = [];
  let zigSign = (rnd() < 0.5) ? 1 : -1;
  let driftY = 0;
  for (let i = 0; i < guideN; i++) {
    const t = i / (guideN - 1);
    const gx = (cx - targetSpan * 0.5) + t * targetSpan;
    let gy;

    if (geom.noiseMode === 'zigzag') {
      gy = cy + zigSign * amp * (0.4 + rnd() * 0.6);
      zigSign = -zigSign;
    } else if (geom.noiseMode === 'drift') {
      driftY += (rnd() - 0.5) * amp * 0.5;
      if (driftY >  amp) driftY =  amp;
      if (driftY < -amp) driftY = -amp;
      gy = cy + driftY;
    } else {
      gy = cy + (rnd() - 0.5) * 2 * amp;
    }
    guide.push({ x: gx, y: gy });
  }

  // Step 2: build spine nodes by interpolating guide with smoothing
  const spineCount = Math.max(1, Math.floor(geom.spineSegments));
  const sm = geom.smoothing;

  for (let i = 0; i <= spineCount; i++) {
    const t = i / spineCount;
    const gIdx = t * (guideN - 1);
    const gi = Math.floor(gIdx);
    const gf = gIdx - gi;

    let rawX, rawY;
    if (gi >= guideN - 1) {
      rawX = guide[guideN - 1].x;
      rawY = guide[guideN - 1].y;
    } else {
      rawX = guide[gi].x + gf * (guide[gi + 1].x - guide[gi].x);
      rawY = guide[gi].y + gf * (guide[gi + 1].y - guide[gi].y);
    }

    nodes.push({ x: rawX, y: rawY });
  }

  // Step 3: blend between angular guide (sm=0) and smoothed (sm=1)
  if (sm > 0) {
    const rawYs = nodes.map(n => n.y);
    const smoothYs = rawYs.slice();
    for (let p = 0; p < 6; p++) {
      const tmp = [smoothYs[0]];
      for (let i = 1; i < smoothYs.length - 1; i++) {
        tmp.push(smoothYs[i - 1] * 0.25 + smoothYs[i] * 0.5 + smoothYs[i + 1] * 0.25);
      }
      tmp.push(smoothYs[smoothYs.length - 1]);
      for (let i = 0; i < smoothYs.length; i++) smoothYs[i] = tmp[i];
    }
    for (let i = 0; i < nodes.length; i++) {
      nodes[i].y = rawYs[i] * (1 - sm) + smoothYs[i] * sm;
    }
  }

  // Step 4: connect spine nodes with segments
  for (let i = 0; i < spineCount; i++) {
    addSegment(nodes, segments, i, i + 1,
               geom.trunkWidth, geom.trunkWidth, geom, rnd);
  }

  const spineNodeCount = nodes.length;
  const sym = geom.symmetry || 0;

  for (let i = 0; i < spineNodeCount; i++) {
    if (rnd() > geom.lateralDensity) continue;

    let spineAngle;
    if (i < spineNodeCount - 1) {
      const a = nodes[i], b = nodes[i + 1];
      spineAngle = Math.atan2(b.y - a.y, b.x - a.x);
    } else {
      const a = nodes[i - 1], b = nodes[i];
      spineAngle = Math.atan2(b.y - a.y, b.x - a.x);
    }

    const nodeRnd = makeSeededRandom((geom.seed ^ ((i + 1) * 2654435761)) >>> 0);
    const upJitter = (nodeRnd() - 0.5) * 1.4;
    const upAngle = spineAngle - Math.PI * 0.5 + upJitter;

    const freeJitter = (rnd() - 0.5) * 1.4;
    const downJitter = sym * (-upJitter) + (1 - sym) * freeJitter;
    const downAngle = spineAngle + Math.PI * 0.5 + downJitter;

    const upRnd = makeSeededRandom((geom.seed ^ ((i + 1) * 1597334677)) >>> 0);
    addBranch(nodes, segments, i, upAngle, geom.branchLen,
              geom.trunkWidth * geom.taper, geom.depth, geom, upRnd, 1);

    const downRnd = sym > 0.99
      ? makeSeededRandom((geom.seed ^ ((i + 1) * 1597334677)) >>> 0)
      : rnd;
    addBranch(nodes, segments, i, downAngle, geom.branchLen,
              geom.trunkWidth * geom.taper, geom.depth, geom, downRnd, sym > 0.99 ? -1 : 1);
  }

  // End branches at spine terminals
  const firstAngle = Math.atan2(nodes[1].y - nodes[0].y, nodes[1].x - nodes[0].x);
  addBranch(nodes, segments, 0, firstAngle + Math.PI, geom.branchLen * 0.8,
            geom.trunkWidth * geom.taper, geom.depth, geom, rnd, 1);

  const lastIdx = spineNodeCount - 1;
  const lastAngle = Math.atan2(
    nodes[lastIdx].y - nodes[lastIdx - 1].y,
    nodes[lastIdx].x - nodes[lastIdx - 1].x
  );
  addBranch(nodes, segments, lastIdx, lastAngle, geom.branchLen * 0.8,
            geom.trunkWidth * geom.taper, geom.depth, geom, rnd, 1);

  return { nodes, segments };
}

/* ---------- Curve baking ---------- */

function evalBezier(p0, cp1, cp2, p3, t) {
  const mt = 1 - t;
  const mt2 = mt * mt;
  const mt3 = mt2 * mt;
  const t2 = t * t;
  const t3 = t2 * t;
  return {
    x: mt3 * p0.x + 3 * mt2 * t * cp1.x + 3 * mt * t2 * cp2.x + t3 * p3.x,
    y: mt3 * p0.y + 3 * mt2 * t * cp1.y + 3 * mt * t2 * cp2.y + t3 * p3.y
  };
}

function bakeCurves(skeleton) {
  const SAMPLES = 12;
  const baked = [];

  for (const seg of skeleton.segments) {
    const a  = skeleton.nodes[seg.from];
    const b  = skeleton.nodes[seg.to];
    const points = [];
    const widths = [];

    for (let i = 0; i <= SAMPLES; i++) {
      const t = i / SAMPLES;
      const pt = evalBezier(a, seg.cp1, seg.cp2, b, t);
      points.push(pt);
      widths.push(seg.widthFrom + t * (seg.widthTo - seg.widthFrom));
    }

    baked.push({ points, widths });
  }

  return baked;
}

/* ---------- Spike precomputation ---------- */

function precomputeSpikes(bakedCurves, geom) {
  const spikes = [];
  const noise = makeValueNoise(geom.seed ^ 0x5B1CE);
  const rnd   = makeSeededRandom(geom.seed ^ 0xBEEF0001);
  let arcLen = 0;

  for (const curve of bakedCurves) {
    for (let i = 0; i < curve.points.length - 1; i++) {
      const a = curve.points[i];
      const b = curve.points[i + 1];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const segLen = Math.sqrt(dx * dx + dy * dy);
      arcLen += segLen;

      if (noise(arcLen * 0.1) > (1 - geom.spikeFreq)) {
        const tLen = segLen || 1;
        const tx = dx / tLen;
        const ty = dy / tLen;
        const nx = -ty;
        const ny =  tx;

        const jitter = (rnd() - 0.5) * Math.PI / 1.5;
        const cosJ = Math.cos(jitter);
        const sinJ = Math.sin(jitter);

        const side = rnd() < 0.5 ? 1 : -1;
        const dirX = side * (nx * cosJ - ny * sinJ);
        const dirY = side * (nx * sinJ + ny * cosJ);

        const sLen = geom.spikeLen * (0.5 + rnd() * 0.5);

        const endX = a.x + dirX * sLen;
        const endY = a.y + dirY * sLen;
        const sharp = geom.spikeSharp;

        spikes.push({
          x: a.x, y: a.y,
          dirX, dirY,
          length: sLen,
          sharpness: sharp,
          xMin: Math.min(a.x, endX) - sharp,
          xMax: Math.max(a.x, endX) + sharp,
          yMin: Math.min(a.y, endY) - sharp,
          yMax: Math.max(a.y, endY) + sharp
        });
      }
    }
  }

  return spikes;
}

/* ---------- Distance field + form pass ---------- */

function shadeFromNormal(nx, ny, nz, light) {
  const dx = light.direction[0], dy = light.direction[1], dz = light.direction[2];
  const lLen = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
  const lx = dx / lLen, ly = dy / lLen, lz = dz / lLen;
  let dot = nx * lx + ny * ly + nz * lz;
  if (dot < 0) dot = 0;
  let l = dot * light.keyIntensity + light.ambient;
  if (l < 0) l = 0;
  else if (l > 1) l = 1;
  return l;
}

function renderFormPass() {
  const W = CANVAS_W, H = CANVAS_H;
  _silhouette.fill(0);
  _luma.fill(0);
  _normals.fill(0);

  const geom = SPECIMEN.geometry;
  const light = SPECIMEN.light;

  const skeleton = buildSkeleton(geom);
  const baked    = bakeCurves(skeleton);
  const spikes   = precomputeSpikes(baked, geom);

  _skeleton   = skeleton;
  _bakedCurves = baked;
  _spikeData   = spikes;

  /* Flatten sub-segments with AABBs for the inner loop. */
  const subSegs = [];
  for (const curve of baked) {
    for (let i = 0; i < curve.points.length - 1; i++) {
      const a = curve.points[i];
      const b = curve.points[i + 1];
      const wA = curve.widths[i];
      const wB = curve.widths[i + 1];
      const maxW = Math.max(wA, wB);
      subSegs.push({
        ax: a.x, ay: a.y,
        bx: b.x, by: b.y,
        wA, wB,
        xMin: Math.min(a.x, b.x) - maxW,
        xMax: Math.max(a.x, b.x) + maxW,
        yMin: Math.min(a.y, b.y) - maxW,
        yMax: Math.max(a.y, b.y) + maxW
      });
    }
  }

  const numSubs   = subSegs.length;
  const numSpikes = spikes.length;

  /* Per-pixel distance field evaluation. */
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      let bestVal = 0;
      let bestPerpX = 0, bestPerpY = 1, bestDSigned = 0;

      for (let s = 0; s < numSubs; s++) {
        const seg = subSegs[s];
        if (px < seg.xMin || px > seg.xMax || py < seg.yMin || py > seg.yMax) continue;

        const sdx = seg.bx - seg.ax;
        const sdy = seg.by - seg.ay;
        const lenSq = sdx * sdx + sdy * sdy;

        let t;
        if (lenSq < 0.001) {
          t = 0;
        } else {
          t = ((px - seg.ax) * sdx + (py - seg.ay) * sdy) / lenSq;
          if (t < 0) t = 0;
          else if (t > 1) t = 1;
        }

        const closestX = seg.ax + t * sdx;
        const closestY = seg.ay + t * sdy;
        const dpx = px - closestX;
        const dpy = py - closestY;
        const d = Math.sqrt(dpx * dpx + dpy * dpy);
        const w = seg.wA + t * (seg.wB - seg.wA);
        if (w < 0.001) continue;

        const val = 1.0 - d / w;
        if (val > bestVal) {
          bestVal = val;
          if (d > 0.001) {
            bestPerpX = dpx / d;
            bestPerpY = dpy / d;
          } else {
            const segLen = Math.sqrt(lenSq) || 1;
            bestPerpX = -sdy / segLen;
            bestPerpY =  sdx / segLen;
          }
          bestDSigned = d / w;
        }
      }

      for (let sp = 0; sp < numSpikes; sp++) {
        const spike = spikes[sp];
        if (px < spike.xMin || px > spike.xMax || py < spike.yMin || py > spike.yMax) continue;

        const dpx = px - spike.x;
        const dpy = py - spike.y;
        const along = dpx * spike.dirX + dpy * spike.dirY;
        if (along < 0) continue;

        const t = along / spike.length;
        if (t > 1) continue;

        const crossX = dpx - along * spike.dirX;
        const crossY = dpy - along * spike.dirY;
        const perp = Math.sqrt(crossX * crossX + crossY * crossY);

        const spikeWidth = spike.sharpness * (1 - t);
        if (spikeWidth < 0.001 || perp > spikeWidth) continue;

        const val = (1 - t) * (1 - perp / spikeWidth) * 0.6;
        if (val > bestVal) {
          bestVal = val;
          if (perp > 0.001) {
            bestPerpX = crossX / perp;
            bestPerpY = crossY / perp;
          } else {
            bestPerpX = -spike.dirY;
            bestPerpY =  spike.dirX;
          }
          bestDSigned = perp / spikeWidth;
        }
      }

      if (bestVal > 0) {
        const idx = py * W + px;
        _silhouette[idx] = 1;

        const dS = bestDSigned;
        const nx = bestPerpX * dS;
        const nyScreen = bestPerpY * dS;
        const nyWorld = -nyScreen;
        const flat = 1 - dS * dS;
        const nz = flat > 0 ? Math.sqrt(flat) : 0;

        const rawLuma = shadeFromNormal(nx, nyWorld, nz, light);

        const edgeT = Math.min(1, bestVal * 4);
        const edgeSmooth = edgeT * edgeT * (3 - 2 * edgeT);
        _luma[idx] = rawLuma * edgeSmooth + (1 - edgeSmooth);

        const ni = idx * 3;
        _normals[ni]     = nx;
        _normals[ni + 1] = nyWorld;
        _normals[ni + 2] = nz;
      }
    }
  }

  let minL = 1, maxL = 0, sumL = 0, count = 0;
  for (let i = 0; i < W * H; i++) {
    if (_silhouette[i]) {
      const l = _luma[i];
      if (l < minL) minL = l;
      if (l > maxL) maxL = l;
      sumL += l;
      count++;
    }
  }
  formData.lumaMin  = count ? minL : 0;
  formData.lumaMax  = count ? maxL : 0;
  formData.lumaMean = count ? sumL / count : 0;
}

/* ---------- Tone pass ---------- */

function applyTone(rawLuma, tone) {
  const range = tone.whitePoint - tone.blackPoint;
  if (range <= 0) return 0;
  let l = (rawLuma - tone.blackPoint) / range;
  if (l < 0) l = 0;
  else if (l > 1) l = 1;
  return Math.pow(l, tone.gamma);
}

/* ---------- Breed pass ---------- */

let myP5;
let currentSeed = SPECIMEN.seed;

const sketch = (p) => {
  let pPaper = null;

  p.setup = function() {
    const c = p.createCanvas(CANVAS_W, CANVAS_H);
    c.parent('sketch');
    p.noLoop();
    pPaper = buildPaperTexture(p);
    renderSpecimen(p, pPaper);
  };

  p.regenerate = function(newSeed) {
    if (newSeed !== undefined) currentSeed = newSeed;
    renderSpecimen(p, pPaper);
  };

  p.savePng = function() {
    p.saveCanvas(`dendrite-${SPECIMEN.breed}-v1`, 'png');
  };
};

function renderSpecimen(p, paper) {
  p.randomSeed(currentSeed);
  p.noiseSeed(currentSeed);
  drawPaper(p, paper);
  drawBreedFromForm(p, SPECIMEN, formData);
  drawGrainOverlay(p);
  drawFrameEdge(p);
}

function buildPaperTexture(p) {
  const buf = p.createGraphics(CANVAS_W, CANVAS_H);
  buf.pixelDensity(1);
  buf.noiseSeed(1234);
  buf.loadPixels();
  for (let y = 0; y < buf.height; y++) {
    for (let x = 0; x < buf.width; x++) {
      const n = buf.noise(x * 0.04, y * 0.04);
      const v = 232 + (n - 0.5) * 18;
      const i = 4 * (y * buf.width + x);
      buf.pixels[i]     = v;
      buf.pixels[i + 1] = v - 4;
      buf.pixels[i + 2] = v - 12;
      buf.pixels[i + 3] = 255;
    }
  }
  buf.updatePixels();
  return buf;
}

function drawPaper(p, paper) {
  p.image(paper, 0, 0);
  p.noStroke();
  for (let i = 0; i < 220; i++) {
    p.fill(40, 36, 30, p.random(8, 22));
    p.rect(p.random(p.width), p.random(p.height), p.random(1, 1.6), p.random(1, 1.6));
  }
}

function drawBreedFromForm(p, s, form) {
  const params = s.breeds[s.breed];
  if      (s.breed === "raster_vertical") drawRasterFromForm(p, s, params, form);
  else if (s.breed === "stipple")         drawStippleFromForm(p, s, params, form);
  else if (s.breed === "halftone")        drawHalftoneFromForm(p, s, params, form);
  else if (s.breed === "riso_noise")      drawRisoNoiseFromForm(p, s, params, form);
  else if (s.breed === "color_blocking")  drawColorBlockingFromForm(p, s, params, form);
  else if (s.breed === "outline")         drawOutlineFromForm(p, s, params, form);
  else if (s.breed === "color_cluster")  drawColorClusterFromForm(p, s, params, form);
}

function drawRasterFromForm(p, s, sp, form) {
  const { silhouette, W: fW, H: fH } = form;
  p.stroke(14, 13, 11, s.inkAlpha);

  for (let cx = 0; cx < p.width; cx += sp.spacing) {
    const fx = Math.floor(cx);
    if (fx < 0 || fx >= fW) continue;
    let runStart = -1;
    for (let fy = 0; fy <= fH; fy++) {
      const inForm = fy < fH ? silhouette[fy * fW + fx] === 1 : false;
      if (inForm && runStart < 0) {
        runStart = fy;
      } else if (!inForm && runStart >= 0) {
        drawRasterColumnRun(p, s, sp, fx, runStart, fy - 1, form, cx);
        runStart = -1;
      }
    }
  }
}

function drawRasterColumnRun(p, s, sp, fx, fyStart, fyEnd, form, cxBase) {
  const tone = s.tone;
  const segLen = sp.segmentLen;
  const jitterRange = Math.max(1.5, segLen * 0.25);
  const jx = p.random(-sp.jitterX, sp.jitterX);

  let fy = fyStart;
  while (fy < fyEnd) {
    const fySegEnd = Math.min(fy + segLen + p.random(-jitterRange, jitterRange), fyEnd);
    const fyMid = Math.floor((fy + fySegEnd) / 2);
    const lIdx = fyMid * form.W + fx;
    const l = applyTone(form.luma[lIdx], tone);

    const dropP = l;
    if (p.random() > dropP) {
      const baseW = sp.weightBase * (1 + p.random(-sp.weightVar, sp.weightVar));
      const lumaWeightMult = 1.15 - l * sp.lumaWeight;
      p.strokeWeight(Math.max(0.4, baseW * lumaWeightMult));

      const cy1 = fy + p.random(-0.3, 0.3);
      const cy2 = fySegEnd + p.random(-0.3, 0.3);
      const cxJ1 = cxBase + jx + p.random(-0.25, 0.25);
      const cxJ2 = cxBase + jx + p.random(-0.25, 0.25);
      p.line(cxJ1, cy1, cxJ2, cy2);
    }
    fy = fySegEnd + p.random(0, Math.max(0.4, segLen * 0.1));
  }
}

function drawStippleFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();

  for (let y = 0; y < fH; y++) {
    for (let x = 0; x < fW; x++) {
      const idx = y * fW + x;
      if (silhouette[idx] !== 1) continue;

      const l = applyTone(luma[idx], tone);
      const localDensity = sp.density * (1 - l);
      if (p.random() > localDensity) continue;

      const jx = p.random(-sp.jitter, sp.jitter);
      const jy = p.random(-sp.jitter, sp.jitter);
      const dotSize = sp.dotSizeBase * (1 + p.random(-sp.dotSizeVar, sp.dotSizeVar));

      const alpha = s.inkAlpha * (1 - l * 0.18);
      p.fill(14, 13, 11, alpha);
      p.circle(x + jx, y + jy, Math.max(0.4, dotSize));
    }
  }
}

function drawHalftoneFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();
  p.fill(14, 13, 11, s.inkAlpha);

  const cell = Math.max(1, sp.cellSize);
  const halfCell = cell * 0.5;
  const dotMax = cell * sp.dotSize;
  const useJitter = sp.jitter > 0;

  for (let cy = halfCell; cy < fH; cy += cell) {
    for (let cx = halfCell; cx < fW; cx += cell) {
      const fx = Math.floor(cx);
      const fy = Math.floor(cy);
      const idx = fy * fW + fx;
      if (silhouette[idx] !== 1) continue;

      const l = applyTone(luma[idx], tone);
      const diameter = dotMax * (1 - l * sp.coverage);
      if (diameter < 0.3) continue;

      let dx = 0, dy = 0;
      if (useJitter) {
        dx = p.random(-sp.jitter, sp.jitter);
        dy = p.random(-sp.jitter, sp.jitter);
      }
      p.circle(cx + dx, cy + dy, diameter);
    }
  }
}

function drawRisoNoiseFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();

  for (const layer of sp.layers) {
    p.fill(layer.color[0], layer.color[1], layer.color[2], layer.color[3]);
    const offX = layer.offset[0] * sp.misreg;
    const offY = layer.offset[1] * sp.misreg;

    for (let y = 0; y < fH; y++) {
      for (let x = 0; x < fW; x++) {
        const idx = y * fW + x;
        if (silhouette[idx] !== 1) continue;

        const l = applyTone(luma[idx], tone);
        let layerDensity = sp.density * layer.densityMult * (1 - l * layer.lumaResponse);
        if (layerDensity <= 0) continue;
        if (layerDensity > 1)  layerDensity = 1;
        if (p.random() > layerDensity) continue;

        const jx = p.random(-sp.jitter, sp.jitter) + offX;
        const jy = p.random(-sp.jitter, sp.jitter) + offY;
        const dotSize = sp.dotSizeBase * (1 + p.random(-sp.dotSizeVar, sp.dotSizeVar));
        p.circle(x + jx, y + jy, Math.max(0.4, dotSize));
      }
    }
  }
}

/* ---------- Breed: color blocking ---------- */

function drawColorBlockingFromForm(p, s, sp, form) {
  const { silhouette, luma, normals, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();

  for (let y = 0; y < fH; y++) {
    for (let x = 0; x < fW; x++) {
      const idx = y * fW + x;
      if (silhouette[idx] !== 1) continue;

      const l = applyTone(luma[idx], tone);

      const ni = idx * 3;
      const nx = normals[ni], ny = normals[ni + 1], nz = normals[ni + 2];

      let color = sp.defaultColor;
      for (const region of sp.regions) {
        const dot = nx * region.dirX + ny * region.dirY + nz * region.dirZ;
        if (dot > region.threshold) {
          color = region.color;
          break;
        }
      }

      const shadeMod = 1 - l * sp.shading;
      const density = sp.density * Math.max(0, shadeMod);
      if (p.random() > density) continue;

      const jx = p.random(-sp.jitter, sp.jitter);
      const jy = p.random(-sp.jitter, sp.jitter);
      const dotSize = sp.dotSizeBase * (1 + p.random(-sp.dotSizeVar, sp.dotSizeVar));

      const alpha = color[3] * (1 - l * sp.shading * 0.5);
      p.fill(color[0], color[1], color[2], Math.max(20, alpha));
      p.circle(x + jx, y + jy, Math.max(0.4, dotSize));
    }
  }
}

/* ---------- Breed: outline ---------- */

function drawOutlineFromForm(p, s, sp, form) {
  const { silhouette, W: fW, H: fH } = form;
  p.noStroke();
  p.fill(s.inkColor[0], s.inkColor[1], s.inkColor[2], s.inkAlpha);

  const weight = sp.weight;
  const useJitter = sp.jitter > 0;

  for (let y = 0; y < fH; y++) {
    for (let x = 0; x < fW; x++) {
      const idx = y * fW + x;
      if (silhouette[idx] !== 1) continue;

      const left  = x > 0      ? silhouette[idx - 1]  : 0;
      const right = x < fW - 1 ? silhouette[idx + 1]  : 0;
      const up    = y > 0      ? silhouette[idx - fW]  : 0;
      const down  = y < fH - 1 ? silhouette[idx + fW]  : 0;

      if (left && right && up && down) continue;

      let jx = 0, jy = 0;
      if (useJitter) {
        jx = p.random(-sp.jitter, sp.jitter);
        jy = p.random(-sp.jitter, sp.jitter);
      }

      p.circle(x + jx, y + jy, weight);
    }
  }
}

/* ---------- Color cluster helpers ---------- */

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (h < 60)  { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  if (max === min) return [0, 0, Math.round(l * 100)];
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if      (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else                h = ((r - g) / d + 4) / 6;
  return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
}

function generatePalette(baseH, baseS, baseL, harmony) {
  const wrap = h => ((h % 360) + 360) % 360;
  let colors;
  switch (harmony) {
    case "complementary":
      colors = [[baseH, baseS, baseL], [wrap(baseH + 180), baseS, baseL]];
      break;
    case "analogous":
      colors = [[wrap(baseH - 30), baseS, baseL], [baseH, baseS, baseL], [wrap(baseH + 30), baseS, baseL]];
      break;
    case "monochromatic":
      colors = [
        [baseH, baseS, Math.max(10, baseL - 20)],
        [baseH, baseS, baseL],
        [baseH, baseS, Math.min(90, baseL + 20)]
      ];
      break;
    case "triadic":
      colors = [[baseH, baseS, baseL], [wrap(baseH + 120), baseS, baseL], [wrap(baseH + 240), baseS, baseL]];
      break;
    case "tetradic":
      colors = [[baseH, baseS, baseL], [wrap(baseH + 90), baseS, baseL], [wrap(baseH + 180), baseS, baseL], [wrap(baseH + 270), baseS, baseL]];
      break;
    case "accented_analogous":
      colors = [[wrap(baseH - 30), baseS, baseL], [baseH, baseS, baseL], [wrap(baseH + 30), baseS, baseL], [wrap(baseH + 180), baseS, baseL]];
      break;
    default:
      colors = [[baseH, baseS, baseL]];
  }
  return colors.map(([h, s, l]) => hslToRgb(h, s, l));
}

function updatePalettePreview() {
  const container = document.getElementById('cc-palette-preview');
  if (!container) return;
  const sp = SPECIMEN.breeds.color_cluster;
  const palette = generatePalette(sp.baseColor[0], sp.baseColor[1], sp.baseColor[2], sp.harmony);
  container.innerHTML = '';
  for (const [r, g, b] of palette) {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = `rgb(${r},${g},${b})`;
    container.appendChild(sw);
  }
  if (sp.darkMix > 0) {
    const dark = hslToRgb(sp.baseColor[0], sp.baseColor[1], 10);
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = `rgb(${dark[0]},${dark[1]},${dark[2]})`;
    container.appendChild(sw);
  }
}

function pickShape(p, sp) {
  const total = sp.circlePct + sp.quadPct + sp.trianglePct;
  if (total <= 0) return "circle";
  const r = p.random(total);
  if (r < sp.circlePct) return "circle";
  if (r < sp.circlePct + sp.quadPct) return "quad";
  return "triangle";
}

function buildDistanceField(silhouette, W, H) {
  const dist = new Float32Array(W * H);
  const INF = 1e6;
  for (let i = 0; i < W * H; i++) dist[i] = silhouette[i] === 1 ? 0 : INF;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (dist[i] === 0) continue;
      if (x > 0)              dist[i] = Math.min(dist[i], dist[i - 1] + 1);
      if (y > 0)              dist[i] = Math.min(dist[i], dist[(y-1)*W + x] + 1);
      if (x > 0 && y > 0)    dist[i] = Math.min(dist[i], dist[(y-1)*W + x - 1] + 1.414);
      if (x < W-1 && y > 0)  dist[i] = Math.min(dist[i], dist[(y-1)*W + x + 1] + 1.414);
    }
  }
  for (let y = H - 1; y >= 0; y--) {
    for (let x = W - 1; x >= 0; x--) {
      const i = y * W + x;
      if (dist[i] === 0) continue;
      if (x < W-1)              dist[i] = Math.min(dist[i], dist[i + 1] + 1);
      if (y < H-1)              dist[i] = Math.min(dist[i], dist[(y+1)*W + x] + 1);
      if (x < W-1 && y < H-1)  dist[i] = Math.min(dist[i], dist[(y+1)*W + x + 1] + 1.414);
      if (x > 0 && y < H-1)    dist[i] = Math.min(dist[i], dist[(y+1)*W + x - 1] + 1.414);
    }
  }
  return dist;
}

function drawColorClusterFromForm(p, s, sp, form) {
  const { silhouette, luma, W: fW, H: fH } = form;
  const tone = s.tone;
  p.noStroke();

  const palette = generatePalette(sp.baseColor[0], sp.baseColor[1], sp.baseColor[2], sp.harmony);
  const darkColor = hslToRgb(sp.baseColor[0], sp.baseColor[1], 10);
  const alpha = Math.round(sp.opacity * 255);
  const useNoise = sp.noiseStrength > 0;
  const useScatter = sp.scatter > 0;
  const dist = useScatter ? buildDistanceField(silhouette, fW, fH) : null;
  const maxAttempts = sp.count * 10;
  let placed = 0;

  for (let attempt = 0; attempt < maxAttempts && placed < sp.count; attempt++) {
    const x = Math.floor(p.random(fW));
    const y = Math.floor(p.random(fH));
    const idx = y * fW + x;
    const inside = silhouette[idx] === 1;

    if (!inside) {
      if (!useScatter) continue;
      const d = dist[idx];
      if (d > sp.scatter) continue;
      const falloff = 1 - (d / sp.scatter);
      if (p.random() > falloff * falloff) continue;
    }

    if (useNoise) {
      const n = p.noise(x * sp.noiseFreq, y * sp.noiseFreq);
      if (p.random() > n * sp.noiseStrength + (1 - sp.noiseStrength)) continue;
    }

    if (inside && sp.lumaResponse > 0) {
      const l = applyTone(luma[idx], tone);
      if (p.random() < l * sp.lumaResponse) continue;
    }

    const isDark = sp.darkMix > 0 && p.random() < sp.darkMix;
    const color = isDark ? darkColor : palette[Math.floor(p.random(palette.length))];
    p.fill(color[0], color[1], color[2], alpha);

    const sizeMult = 1 - sp.sizeVar + p.random() * sp.sizeVar * 2;
    const markSize = Math.max(0.5, sp.size * sizeMult);
    const shape = pickShape(p, sp);

    if (shape === "circle") {
      p.circle(x, y, markSize);
    } else {
      const rot = sp.rotation > 0 ? p.random(-sp.rotation, sp.rotation) * Math.PI / 180 : 0;
      p.push();
      p.translate(x, y);
      if (rot !== 0) p.rotate(rot);
      if (shape === "quad") {
        const half = markSize / 2;
        p.rect(-half, -half, markSize, markSize);
      } else {
        const r = markSize / 2;
        p.triangle(0, -r, -r * 0.866, r * 0.5, r * 0.866, r * 0.5);
      }
      p.pop();
    }

    placed++;
  }
}

/* ---------- Texture overlays ---------- */

function drawGrainOverlay(p) {
  p.noStroke();
  for (let i = 0; i < 850; i++) {
    p.fill(20, 18, 14, p.random(6, 16));
    p.rect(p.random(p.width), p.random(p.height), 1, 1);
  }
  for (let i = 0; i < 320; i++) {
    p.fill(248, 244, 236, p.random(18, 46));
    p.rect(p.random(p.width), p.random(p.height), 1, 1);
  }
}

function drawFrameEdge(p) {
  p.noFill();
  p.stroke(20, 18, 14, 22);
  p.strokeWeight(1);
  p.rect(0.5, 0.5, p.width - 1, p.height - 1);
}

/* ---------- Update orchestration ---------- */

let _formScheduled = false;
let _breedScheduled = false;

function scheduleFormUpdate() {
  if (_formScheduled) return;
  _formScheduled = true;
  requestAnimationFrame(() => {
    _formScheduled = false;
    renderFormPass();
    updateDebugCanvas();
    updateLumaReadout();
    scheduleBreedUpdate();
    updateSpecimenView();
  });
}

function scheduleBreedUpdate() {
  if (_breedScheduled) return;
  _breedScheduled = true;
  requestAnimationFrame(() => {
    _breedScheduled = false;
    if (myP5) myP5.regenerate();
    updateToneCurve();
    updateSpecimenView();
  });
}

function updateDebugCanvas() {
  const lumaCanvas   = document.getElementById('formDebugLuma');
  const normalCanvas = document.getElementById('formDebugNormals');
  if (!lumaCanvas || !normalCanvas) return;
  const lumaCtx   = lumaCanvas.getContext('2d');
  const normalCtx = normalCanvas.getContext('2d');
  const lumaImg   = lumaCtx.createImageData(CANVAS_W, CANVAS_H);
  const normalImg = normalCtx.createImageData(CANVAS_W, CANVAS_H);

  for (let i = 0; i < CANVAS_W * CANVAS_H; i++) {
    if (_silhouette[i]) {
      const v = Math.round(_luma[i] * 255);
      lumaImg.data[i * 4]     = v;
      lumaImg.data[i * 4 + 1] = v;
      lumaImg.data[i * 4 + 2] = v;
      lumaImg.data[i * 4 + 3] = 255;

      const ni = i * 3;
      normalImg.data[i * 4]     = Math.round((_normals[ni]     * 0.5 + 0.5) * 255);
      normalImg.data[i * 4 + 1] = Math.round((_normals[ni + 1] * 0.5 + 0.5) * 255);
      normalImg.data[i * 4 + 2] = Math.round((_normals[ni + 2] * 0.5 + 0.5) * 255);
      normalImg.data[i * 4 + 3] = 255;
    }
  }

  lumaCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  lumaCtx.putImageData(lumaImg, 0, 0);
  normalCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  normalCtx.putImageData(normalImg, 0, 0);

  drawSkeletonOverlay(lumaCtx);
}

function drawSkeletonOverlay(ctx) {
  if (!_bakedCurves || !_skeleton) return;

  ctx.strokeStyle = 'rgba(200, 40, 40, 0.5)';
  ctx.lineWidth = 1;
  for (const curve of _bakedCurves) {
    ctx.beginPath();
    for (let i = 0; i < curve.points.length; i++) {
      const p = curve.points[i];
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(200, 40, 40, 0.7)';
  for (const node of _skeleton.nodes) {
    ctx.beginPath();
    ctx.arc(node.x, node.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  if (_spikeData) {
    ctx.strokeStyle = 'rgba(40, 160, 40, 0.4)';
    ctx.lineWidth = 0.5;
    for (const spike of _spikeData) {
      ctx.beginPath();
      ctx.moveTo(spike.x, spike.y);
      ctx.lineTo(spike.x + spike.dirX * spike.length, spike.y + spike.dirY * spike.length);
      ctx.stroke();
    }
  }
}

function updateLumaReadout() {
  const r = document.getElementById('luma-readout');
  r.textContent = `LUMA ${formData.lumaMin.toFixed(2)} · ${formData.lumaMean.toFixed(2)} · ${formData.lumaMax.toFixed(2)}`;
}

function updateToneCurve() {
  const path = document.getElementById('tone-curve-path');
  if (!path) return;
  const W = 48, H = 24, N = 32;
  let d = '';
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    const y = applyTone(x, SPECIMEN.tone);
    d += (i === 0 ? 'M' : 'L') + (x * W).toFixed(2) + ',' + (H - y * H).toFixed(2) + ' ';
  }
  path.setAttribute('d', d.trim());
}

function updateSpecimenView() {
  const view = {
    species:  SPECIMEN.species,
    breed:    SPECIMEN.breed,
    geometry: SPECIMEN.geometry,
    light:    SPECIMEN.light,
    tone:     SPECIMEN.tone,

    paperGrain: SPECIMEN.paperGrain,
    inkAlpha:   SPECIMEN.inkAlpha,
    seed:       SPECIMEN.seed
  };
  document.getElementById('specimenView').textContent = JSON.stringify(view, null, 2);
}

  set('cc-scatter',        'cc-scatter-val',        DEFAULTS.breeds.color_cluster.scatter, fmt0);
  const ccBaseRgb = hslToRgb(DEFAULTS.breeds.color_cluster.baseColor[0], DEFAULTS.breeds.color_cluster.baseColor[1], DEFAULTS.breeds.color_cluster.baseColor[2]);
  const ccHex = '#' + ccBaseRgb.map(c => c.toString(16).padStart(2,'0')).join('');
  document.getElementById('cc-baseColor').value = ccHex;
  document.getElementById('cc-baseColor-val').textContent = ccHex.toUpperCase();
  document.querySelectorAll('input[name="cc-harmony"]').forEach(r => {
    r.checked = r.value === DEFAULTS.breeds.color_cluster.harmony;
  });
  updatePalettePreview();

  setBreed(DEFAULTS.breed);
  scheduleFormUpdate();
});
</script>

</body>
